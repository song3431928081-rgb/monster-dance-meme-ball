<title>万圣夜：怪物狂欢曲 Halloween: Monster Mash-Up</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nosifer&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: "Cinzel Decorative", "Cinzel", "Georgia", "Microsoft YaHei", serif; touch-action:none; }
  #game-root { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game-canvas { display:block; width:100%; height:100%; touch-action:none; }
  /* 竖屏舞台容器 */
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:#0a0612; }
  /* 扫描线覆盖层（极淡，哥特风） */
  #fx-overlay { position:absolute; inset:0; pointer-events:none; z-index:30; mix-blend-mode:overlay; opacity:0.08;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px, transparent 1px, transparent 3px); }
  /* 雾气覆盖层 */
  #fx-vignette { position:absolute; inset:0; pointer-events:none; z-index:31;
    box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.9); }
  #fx-glitch { position:absolute; inset:0; pointer-events:none; z-index:29; opacity:0;
    background:linear-gradient(90deg, rgba(255,102,0,0.18), rgba(74,111,165,0.18), rgba(200,160,48,0.18)); mix-blend-mode:screen; }
  /* 飘雾动画 */
  #fx-mist { position:absolute; inset:0; pointer-events:none; z-index:28; opacity:0.35;
    background:
      radial-gradient(circle at 20% 80%, rgba(58,140,58,0.10), transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(74,111,165,0.10), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(200,160,48,0.06), transparent 50%);
    animation: mistdrift 18s ease-in-out infinite alternate; }
  @keyframes mistdrift { 0%{transform:translate(0,0);} 100%{transform:translate(-3%,2%);} }
  /* 鱼眼 */
  .fisheye #stage { border-radius:24px; }
  /* 弹幕层 */
  #barrage { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
  .barrage-item { position:absolute; white-space:nowrap; font-weight:700; font-size:22px; color:#fff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 0 0 12px #ff6600, 0 0 18px #3a8c3a; animation: bslide linear forwards; }
  @keyframes bslide { from { transform:translateX(110vw);} to { transform:translateX(-110vw);} }
  /* 大字梗 */
  #bigmeme { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:45; opacity:0; }
  #bigmeme span { font-family:"Cinzel Decorative","Cinzel","Georgia",serif; font-size:clamp(40px,14vw,120px); font-weight:900; color:#c8a030;
    text-shadow: 4px 4px 0 #000, -2px -2px 0 #ff6600, 0 0 30px #c8a030, 0 0 50px #ff6600; transform:rotate(-8deg); }
  /* 抽象值条 */
  #meter-wrap { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:50;
    width:60%; max-width:300px; height:14px; background:rgba(0,0,0,0.6); border:2px solid #c8a030;
    border-radius:6px 18px 6px 18px; overflow:hidden; box-shadow:0 0 12px rgba(200,160,48,0.6); }
  #meter-fill { height:100%; width:0%; background:linear-gradient(90deg,#3a8c3a,#c8a030,#ff6600);
    transition:width 0.2s; box-shadow:0 0 10px #c8a030; }
  #meter-label { position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:12px; color:#c8a030;
    text-shadow:1px 1px 0 #000; white-space:nowrap; font-weight:bold; letter-spacing:1px; }
  /* UI 按钮 */
  #ui { position:absolute; inset:0; z-index:60; pointer-events:none; }
  .btn { pointer-events:auto; display:flex; align-items:center; justify-content:center;
    background:rgba(10,6,18,0.8); border:2px solid #c8a030; color:#fff; border-radius:30% 50% 30% 50%;
    width:54px; height:54px; font-size:22px; cursor:pointer; box-shadow:0 0 10px rgba(200,160,48,0.5), inset 0 0 8px rgba(58,140,58,0.2);
    transition:transform 0.1s, background 0.2s; }
  .btn:active { transform:scale(0.88); background:rgba(58,140,58,0.5); }
  .btn-row { position:absolute; display:flex; gap:10px; }
  #top-left { top:14px; left:14px; }
  #top-right { top:14px; right:14px; }
  #bottom-center { bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); }
  #bottom-left { bottom:calc(18px + env(safe-area-inset-bottom)); left:14px; }
  #bottom-right { bottom:calc(18px + env(safe-area-inset-bottom)); right:14px; }
  .btn .label { font-size:10px; position:absolute; bottom:-16px; color:#fff; text-shadow:1px 1px 0 #000; white-space:nowrap; }
  .btn-wrap { position:relative; }
  /* 开始界面 */
  #start-screen { position:absolute; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, #2a1a0a 0%, #05020a 80%);
    padding:20px; text-align:center; overflow:hidden; }
  #start-screen h1 { font-family:"Nosifer","Cinzel Decorative",serif; font-size:clamp(28px,9vw,56px); color:#c8a030; font-weight:900; line-height:1.15;

  #start-screen .sub { font-family:"Cinzel Decorative",serif; font-size:clamp(14px,4.5vw,20px); color:#ff6600; margin-bottom:30px; text-shadow:2px 2px 0 #000, 0 0 10px #c8a030; }
  #start-screen .slogan { font-size:clamp(13px,4vw,17px); color:#3a8c3a; margin-bottom:36px; max-width:320px; line-height:1.6; text-shadow:1px 1px 0 #000; }
  #start-btn { pointer-events:auto; padding:16px 44px; font-size:24px; font-weight:bold; color:#fff; font-family:"Cinzel Decorative",serif;
    background:linear-gradient(135deg,#1a0a2a,#3a2a0a); border:2px solid #c8a030; border-radius:8px 24px 8px 24px; cursor:pointer;
    box-shadow:0 0 20px rgba(200,160,48,0.6), 0 6px 0 #1a0a00; animation: pulse 1.2s ease-in-out infinite; }
  #start-btn:active { transform:translateY(4px); box-shadow:0 0 12px rgba(200,160,48,0.5), 0 2px 0 #1a0a00; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .hint { font-size:12px; color:#8a7a5a; margin-top:18px; max-width:300px; line-height:1.7; }
  /* 开始界面飘动幽灵 & 摇曳烛火 */
  .ghost-float { position:absolute; font-size:30px; opacity:0.5; pointer-events:none; filter:blur(0.5px); }
  .ghost-float.g1 { top:18%; left:12%; animation: gfloat 7s ease-in-out infinite; }
  .ghost-float.g2 { top:30%; right:14%; animation: gfloat 9s ease-in-out infinite 1s; }
  .ghost-float.g3 { bottom:22%; left:18%; animation: gfloat 8s ease-in-out infinite 0.5s; }
  .ghost-float.g4 { bottom:30%; right:20%; animation: gfloat 10s ease-in-out infinite 1.5s; }
  @keyframes gfloat { 0%,100%{transform:translateY(0) rotate(-4deg); opacity:0.4;} 50%{transform:translateY(-26px) rotate(4deg); opacity:0.7;} }
  .candle { position:absolute; font-size:24px; pointer-events:none; animation: flicker 0.25s ease-in-out infinite alternate; }
  .candle.c1 { top:14%; left:45%; }
  .candle.c2 { top:14%; right:38%; }
  @keyframes flicker { 0%{opacity:0.7; transform:scale(0.95) rotate(-3deg);} 100%{opacity:1; transform:scale(1.05) rotate(3deg);} }
  /* 录制指示 */
  #rec-indicator { position:absolute; top:54px; left:50%; transform:translateX(-50%); z-index:55;
    display:none; align-items:center; gap:6px; color:#ff3344; font-weight:bold; font-size:13px; text-shadow:1px 1px 0 #000; }
  #rec-dot { width:12px; height:12px; background:#ff3344; border-radius:50%; animation: blink 0.8s infinite; }
  @keyframes blink { 50%{opacity:0.3;} }
  /* 挑战码弹窗 */
  #share-modal { position:absolute; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.85); padding:20px; }
  #share-box { background:#1a0a2a; border:2px solid #c8a030; border-radius:8px 20px 8px 20px; padding:24px; max-width:340px; width:100%;
    text-align:center; box-shadow:0 0 30px rgba(200,160,48,0.5); }
  #share-box h3 { color:#c8a030; margin-bottom:10px; font-size:20px; font-family:"Cinzel Decorative",serif; }
  #share-code { font-size:30px; font-weight:900; color:#c8a030; letter-spacing:4px; margin:16px 0; font-family:monospace;
    background:#05020a; padding:10px; border-radius:8px; border:1px solid #3a8c3a; }
  .share-btn { padding:12px 18px; margin:6px; font-size:14px; font-weight:bold; color:#fff;
    background:linear-gradient(135deg,#1a0a2a,#3a2a0a); border:1px solid #c8a030; border-radius:20px; cursor:pointer; }
  #close-share { background:#2a1a0a; }
  /* 横屏提示 */
  #rotate-hint { display:none; position:absolute; inset:0; z-index:300; background:#000; color:#c8a030;
    align-items:center; justify-content:center; flex-direction:column; font-size:18px; text-align:center; padding:30px; }
  @media (orientation:landscape) and (max-height:500px) {
    #rotate-hint { display:flex; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* ============================================================
   Monster Meme Ball: Dark Dance Madness
   Single-file HTML + Three.js + Web Audio API
   ============================================================ */
(function(){
'use strict';

// ---------- 全局工具 ----------
const TAU = Math.PI*2;
const rand = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;

// ---------- 挑战码生成 ----------
function genChallengeCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[randi(0,chars.length)];
  return s;
}
function seededRandom(seed){
  let h = 2166136261>>>0;
  for(let i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619); }
  return function(){ h += 0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
}

// ---------- 音频引擎（Web Audio API 程序化生成）----------
const AudioEngine = {
  ctx:null, master:null, muted:false, bpm:140,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    }catch(e){ console.warn('Audio unavailable',e); }
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value=m?0:0.35; },
  // 基础音色
  tone(freq,dur,type='square',vol=0.3,slide=0){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol=0.3,filter=800){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, buf=this.ctx.createBuffer(1,this.ctx.sampleRate*dur,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filter;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur);
  },
  // 管风琴音色（正弦波 55/110/220 带 detune，阴森）
  organ(freq,dur=0.4,vol=0.22){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    g.connect(this.master);
    [freq, freq*2, freq*4].forEach((fh,i)=>{ const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(fh,t); o.detune.setValueAtTime((i-1)*6,t); o.connect(g); o.start(t); o.stop(t+dur+0.02); });
  },
  // 骨头敲击（短噪声快速衰减，像骷髅骨头咯咯）
  boneKnock(){ this.noise(0.06,0.22,2500); this.noise(0.04,0.12,900); },
  // 音效库
  kick(){ this.tone(60,0.15,'sine',0.5,0.3); this.noise(0.05,0.1,400); this.boneKnock(); },
  snare(){ this.noise(0.12,0.25,2000); this.tone(180,0.05,'triangle',0.15); },
  hat(){ this.noise(0.04,0.12,8000); },
  bass(){ this.organ(55,0.4,0.24); },
  spring(){ this.tone(400,0.25,'sine',0.2,3); this.tone(600,0.25,'sine',0.15,0.3); },
  bark(){ this.tone(140,0.12,'sawtooth',0.25,0.6); this.noise(0.1,0.15,500); },
  scream(){ this.tone(800,0.3,'sawtooth',0.2,0.2); this.noise(0.3,0.1,3000); },
  fart(){ this.tone(90,0.2,'sawtooth',0.25,0.4); this.noise(0.15,0.1,200); },
  rewind(){ for(let i=0;i<8;i++){ setTimeout(()=>this.tone(200+i*80,0.05,'square',0.1),i*40);} },
  boom(){ this.tone(40,0.5,'sine',0.6,0.2); this.noise(0.4,0.3,300); },
  zap(){ this.tone(1200,0.1,'square',0.15,0.1); this.noise(0.08,0.1,6000); },
  whoosh(){ this.noise(0.3,0.15,400); this.ghostWhisper(); },
  // 幽灵低语（带通滤波噪声 + 慢起音）
  ghostWhisper(){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, dur=0.7, buf=this.ctx.createBuffer(1,this.ctx.sampleRate*dur,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(1400,t+dur); f.Q.value=6;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.08,t+0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur);
  },
  // 唢呐风（滑音）
  suona(freq){ this.tone(freq,0.4,'sawtooth',0.2,1.1); this.tone(freq*1.5,0.4,'square',0.1,1.1); },
  // 播放节奏型
  beatCount:0,
  playBeat(){
    this.beatCount++;
    const b=this.beatCount%4;
    // BGM 已自带鼓点，只在 BGM 关闭时播放鼓
    if(!this.bgmPlaying){
      if(b===0){ this.kick(); this.bass(); }
      else if(b===2){ this.snare(); this.boneKnock(); }
      else { this.hat(); }
    }
    // 偶尔加花（阴森小调音阶）
    if(Math.random()<0.15){ const notes=[110,147,165,196,233]; this.suona(pick(notes)); }
    if(Math.random()<0.05){ pick([this.bark,this.fart,this.scream,this.spring]).call(this); }
  },
  // ---------- 背景音乐 BGM（程序化循环）----------
  bgmPlaying:false, bgmStep:0, bgmTimer:null,
  // 32-step melody (frequencies in Hz, 0=rest) — 阴森小调，降一个八度
  bgmMelody:[
    262,330,392,330, 262,330,392,440, 392,330,294,262, 0,330,392,262,
    262,294,330,392, 440,392,330,294, 262,0,330,0, 392,330,262,0
  ],
  bgmBass:[
    55,0,0,0, 73,0,0,0, 82,0,0,0, 65,0,0,0,
    55,0,0,0, 73,0,0,0, 82,0,65,0, 55,0,0,0
  ],
  startBGM(){
    if(this.bgmPlaying || !this.ctx || this.muted) return;
    this.bgmPlaying = true;
    this.bgmStep = 0;
    const stepDur = 60/this.bpm/4; // 16th note
    const scheduleStep = ()=>{
      if(!this.bgmPlaying) return;
      const step = this.bgmStep % 32;
      const m = this.bgmMelody[step];
      if(m) this.organ(m, stepDur*1.6, 0.13);
      const b = this.bgmBass[step];
      if(b) this.organ(b, stepDur*2.2, 0.18);
      if(step%2===0) this.hat();
      if(step%8===0) this.kick();
      if(step%8===4){ this.snare(); this.boneKnock(); }
      if(step===30 && Math.random()<0.4) this.ghostWhisper();
      if(step===15 && Math.random()<0.15) this.fart();
      this.bgmStep++;
    };
    scheduleStep();
    this.bgmTimer = setInterval(scheduleStep, stepDur*1000);
  },
  stopBGM(){
    this.bgmPlaying = false;
    if(this.bgmTimer){ clearInterval(this.bgmTimer); this.bgmTimer=null; }
  },
  toggleBGM(){
    if(this.bgmPlaying){ this.stopBGM(); return false; }
    else { this.startBGM(); return true; }
  }
};

// 程序化纹理：魔法阵
function makeMagicCircleTexture(){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const x = c.getContext('2d');
  x.fillStyle='#0a0604'; x.fillRect(0,0,256,256);
  x.translate(128,128); x.strokeStyle='#c8a030'; x.lineWidth=2; x.shadowColor='#c8a030'; x.shadowBlur=8;
  for(let r=0;r<3;r++){ x.beginPath(); x.arc(0,0,40+r*38,0,TAU); x.stroke(); }
  // 五芒星
  x.beginPath();
  for(let i=0;i<=5;i++){ const a=-Math.PI/2+i*TAU*2/5; const px=Math.cos(a)*110, py=Math.sin(a)*110; i?x.lineTo(px,py):x.moveTo(px,py); }
  x.stroke();
  // 符文刻线
  x.lineWidth=1; x.strokeStyle='#3a8c3a';
  for(let i=0;i<12;i++){ const a=i*TAU/12; x.beginPath(); x.moveTo(Math.cos(a)*78,Math.sin(a)*78); x.lineTo(Math.cos(a)*96,Math.sin(a)*96); x.stroke(); }
  const t=new THREE.CanvasTexture(c); return t;
}
// 程序化纹理：月亮陨石坑
function makeMoonTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#fff8dc'; x.fillRect(0,0,256,256);
  for(let i=0;i<40;i++){
    const r=rand(4,22), px=rand(0,256), py=rand(0,256);
    x.fillStyle='rgba(160,140,90,'+rand(0.15,0.4)+')';
    x.beginPath(); x.arc(px,py,r,0,TAU); x.fill();
  }
  for(let i=0;i<20;i++){ x.fillStyle='rgba(120,100,70,'+rand(0.2,0.5)+')'; x.beginPath(); x.arc(rand(0,256),rand(0,256),rand(2,8),0,TAU); x.fill(); }
  return new THREE.CanvasTexture(c);
}
// 程序化纹理：南瓜鬼脸

      bub.position.set(rand(-0.3,0.3),0,rand(-0.3,0.3)); bubbles.add(bub); bubs.push({mesh:bub,phase:rand(0,TAU),sp:rand(0.5,1.2)});
    }
    bubblesArr.push(bubs);

  // 南瓜鬼脸灯

function createMonster(type, rng){
  if(!rng) rng = Math.random;
  const g = new THREE.Group();
  g.userData.type = type;
  g.userData.parts = {};
  const P = g.userData.parts;

  // 平滑材质（去掉 flatShading，圆润像真人）
  function mat(color, opts={}){
    return new THREE.MeshStandardMaterial(Object.assign({
      color, roughness:0.75, metalness:0.0
    }, opts));
  }
  function loopit(color){
    return mat(color);
  }
  function skin(color){
    return new THREE.MeshStandardMaterial({ color, roughness:0.65, metalness:0.0 });
  }

  // 角色主颜色：亮饱和纯色
  const bodyColor = type==='frankenstein'?0x44cc55 : type==='sea_witch'?0xbb44dd : type==='witch_mouse'?0xffdd44 : 0xf5ead0;
  const skinColor = type==='vampire'?0xffeedd : 0xf5ead0;

  // ============ 人形身体：收腰躯干 + 球关节四肢 ============
  // 胸腔（上宽下窄的圆柱，有肩膀感）
  const chest = new THREE.Mesh(
    new THREE.CylinderGeometry(0.44, 0.32, 0.62, 28),
    loopit(bodyColor)
  );
  chest.position.y = 0.55; chest.castShadow = true;
  g.add(chest); P.chest = chest;
  // 腰胯（上窄下宽，胯部略宽）
  const waist = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.4, 0.38, 28),
    loopit(bodyColor)
  );
  waist.position.y = 0.05; waist.castShadow = true;
  g.add(waist); P.body = waist;
  // 脖子
  const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.14, 0.16, 20),
    loopit(skinColor)
  );
  neck.position.y = 0.92; g.add(neck);

  // 肩关节球（留在身体上，不随手臂旋转）
  const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 16), loopit(bodyColor));
  shoulderL.position.set(-0.4, 0.72, 0); g.add(shoulderL);
  const shoulderR = shoulderL.clone(); shoulderR.position.x = 0.4; g.add(shoulderR);
  // 髋关节球
  const hipJointL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 16), loopit(bodyColor));
  hipJointL.position.set(-0.18, -0.12, 0); g.add(hipJointL);
  const hipJointR = hipJointL.clone(); hipJointR.position.x = 0.18; g.add(hipJointR);

  // --- 头部（球体，略拉长）---
  let headColor = skinColor;
  if(type==='pumpkin_king') headColor=0xff6611;
  if(type==='mummy') headColor=0xfff2dd;
  if(type==='dark_witch') headColor=0x44cc66;
  if(type==='vampire') headColor=0xffeedd;
  const headGeo = new THREE.SphereGeometry(type==='pumpkin_king'?0.4:0.36, 32, 24);
  headGeo.scale(1, 1.12, 1); // 头部略纵向拉长
  const head = new THREE.Mesh(headGeo, loopit(headColor));
  head.position.y = 1.28; head.castShadow=true;
  g.add(head); P.head=head;

  // --- 脸：人眼 + 眉毛 + 鼻子 + 嘴巴 ---
  function makeEyeMesh(x,y,z,r,color){
    const e = new THREE.Mesh(new THREE.SphereGeometry(r,24,20), new THREE.MeshStandardMaterial({color, roughness:0.4}));
    e.position.set(x,y,z); return e;
  }
  function makeSmile(){
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 20, 16),
      new THREE.MeshStandardMaterial({color:0xcc1122, roughness:0.5})
    );
    s.scale.set(1.6, 0.4, 0.5);
    return s;
  }
  // 眉毛
  function makeBrow(x,y,z){
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.2,6), mat(0x221111));
    b.position.set(x,y,z); b.rotation.z = Math.PI/2;

    g.add(smile); P.mouth=smile;

    const tongue = makeTongue();
    tongue.position.set(0,1.08,0.38); tongue.scale.setScalar(0.3);
    g.add(tongue); P.tongue=tongue;
  } else {
    const e1=makeEyeMesh(-0.14,1.3,0.36,0.08,0xffcc00);

    grin.scale.set(2.0,0.5,0.7);
    grin.position.set(0,1.05,0.36);
    g.add(grin); P.mouth=grin;
  }

  // ============ 手臂：上臂 + 肘球 + 前臂 + 手（球关节）============
  const armColor = bodyColor;
  const handColor = type==='frankenstein'?0x44cc55 : type==='witch_mouse'?0xffdd44 : skinColor;
  const footColor = 0x333355;

  function makeArm(side){
    const shoulder = new THREE.Group(); // 旋转轴心在肩关节
    const upper = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.085, 0.4, 22),
      loopit(armColor)
    );

    const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.09, 18, 14), loopit(armColor));
    elbow.position.y = -0.4;
    const fore = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.07, 0.36, 22),
      loopit(armColor)
    );
    fore.position.y = -0.58; fore.castShadow = true;
    const hand = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 18, 14),
      loopit(handColor)
    );
    hand.scale.set(1, 0.75, 0.6);
    hand.position.y = -0.78;
    shoulder.add(upper, elbow, fore, hand);
    return shoulder;
  }

  const armL = makeArm(-1); armL.position.set(-0.4, 0.72, 0); P.armL=armL; g.add(armL);
  const armR = makeArm(1);  armR.position.set( 0.4, 0.72, 0); P.armR=armR; g.add(armR);

  // ============ 腿：大腿 + 膝球 + 小腿 + 脚（球关节）============
  const legColor = bodyColor;
  function makeLeg(){
    const hip = new THREE.Group(); // 旋转轴心在髋关节
    const thigh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.14, 0.11, 0.48, 22),
      loopit(legColor)
    );
    thigh.position.y = -0.24; thigh.castShadow = true;
    const knee = new THREE.Mesh(new THREE.SphereGeometry(0.11, 18, 14), loopit(legColor));
    knee.position.y = -0.48;
    const shin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.08, 0.42, 22),
      loopit(legColor)
    );
    shin.position.y = -0.69; shin.castShadow = true;
    const foot = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 18, 14),
      loopit(footColor)
    );
    foot.scale.set(0.8, 0.5, 1.4);
    foot.position.y = -0.96; foot.position.z = 0.08;
    hip.add(thigh, knee, shin, foot);
    return hip;
  }

  const legL = makeLeg(); legL.position.set(-0.18, -0.12, 0); P.legL=legL; g.add(legL);
  const legR = makeLeg(); legR.position.set( 0.18, -0.12, 0); P.legR=legR; g.add(legR);

  // --- 特征装饰 ---
  decorateMonster(g, type, mat, loopit, rng);

  // 果冻基础缩放
  g.userData.baseScale = 1;
  g.userData.squash = 1;
  g.userData.stretch = 1;
  return g;
}

function addOutline(group, thickness){
  const outlineMat = new THREE.MeshBasicMaterial({ color:0x000000, side:THREE.BackSide });
  group.traverse(obj=>{
    if(obj.isMesh && obj.material && obj.material.color){
      // 跳过已经是纯黑或发光的
      try{
        const clone = obj.clone();
        clone.material = outlineMat;
        clone.scale.multiplyScalar(1+thickness);
        clone.position.copy(obj.position);
        obj.parent.add(clone);
      }catch(e){}
    }
  });
}

// 动画角色
function animateMonster(m, dt, t, beat){
  const P = m.userData.parts;
  const bpm = AudioEngine.bpm;
  const beatDur = 60/bpm;
  const beatPhase = (t % beatDur)/beatDur;
  const beatPunch = Math.pow(1-beatPhase, 3); // 节拍冲击

  // 基础律动（魔性弹动：重拍下沉+胸腔pop）
  const beatFreq = bpm*TAU/60;
  const baseBob = Math.sin(t*beatFreq)*0.18;
  const popBob = Math.abs(Math.sin(t*beatFreq*0.5))*0.22; // 每两拍一次大pop
  m.position.y = baseBob + popBob;
  // 全身左右乱晃（魔性）
  m.rotation.y = Math.sin(t*beatFreq*0.3)*0.25 + Math.sin(t*1.7)*0.08;
  m.rotation.x = Math.sin(t*beatFreq*0.4)*0.1;

  // 胸腔beat pop（魔性核心：身体跟着重拍抖）
  if(P.chest){
    P.chest.position.y = 0.55 + Math.abs(Math.sin(t*beatFreq))*0.13;
    P.chest.scale.y = 1 + beatPunch*0.16;
    P.chest.rotation.z = Math.sin(t*beatFreq*0.5)*0.12;
    P.chest.rotation.x = Math.sin(t*beatFreq*0.7)*0.08;
  }
  // 腰部扭胯（魔性核心：胯部左右甩 + 前后顶）
  if(P.body){
    P.body.position.y = 0.05 + Math.sin(t*beatFreq*0.5)*0.05;
    P.body.rotation.z = Math.sin(t*beatFreq)*0.18;
    P.body.rotation.x = Math.sin(t*beatFreq*0.6)*0.1;
    P.body.scale.y = 1 - beatPunch*0.08;
  }

  // 果冻挤压（更夸张，魔性）
  const squash = 1 - beatPunch*0.28;
  const stretch = 1 + beatPunch*0.28;
  m.scale.y = stretch * m.userData.stretch;
  m.scale.x = squash * m.userData.squash;
  m.scale.z = squash * m.userData.squash;

  // 头部默认疯狂乱甩（除非动作本身控制头）
  const headControlled = ['headbang','head_fly','chicken','shake','dab'].includes(currentMove);
  if(P.head && !headControlled){
    P.head.rotation.x = Math.abs(Math.sin(t*beatFreq))*0.28;
    P.head.rotation.z = Math.sin(t*beatFreq*0.5)*0.22;
    P.head.rotation.y = Math.sin(t*beatFreq*0.25)*0.18;
    P.head.position.y = 1.28 + Math.sin(t*beatFreq*2)*0.03;
  }

  // 随机变异（更频繁，更魔性）
  if(Math.random()<0.006){ triggerMutation(m); }

  switch(currentMove){
    case 'twerk':
      m.rotation.z = Math.sin(t*8)*0.4;
      if(P.legL) P.legL.rotation.x = Math.sin(t*8)*0.6;
      if(P.legR) P.legR.rotation.x = Math.sin(t*8+Math.PI)*0.6;
      if(P.chest) P.chest.position.y = 0.55 + Math.sin(t*8)*0.14;
      if(P.body) P.body.rotation.z = Math.sin(t*8)*0.2;
      break;
    case 'headbang':
      if(P.head) P.head.rotation.x = Math.sin(t*10)*1.3;
      m.position.y = baseBob + Math.abs(Math.sin(t*10))*0.35;
      break;
    case 'floss':
      if(P.armL) P.armL.rotation.z = Math.sin(t*6)*1.8;
      if(P.armR) P.armR.rotation.z = Math.sin(t*6+Math.PI)*1.8;
      if(P.legL) P.legL.rotation.x = Math.sin(t*3)*0.7;
      m.rotation.z = Math.sin(t*6)*0.2;
      break;
    case 'robot':
      const rt = Math.floor(t*4)/4;
      m.rotation.y = Math.sin(rt*2)*0.5;
      if(P.armR) P.armR.rotation.x = Math.floor(t*2)%2? -1.2:0;
      if(P.armL) P.armL.rotation.x = Math.floor(t*2+1)%2? -1.2:0;
      break;
    case 'breakdance':
      m.rotation.z = t*4;
      m.position.y = -0.55;
      if(P.legL) P.legL.rotation.x = Math.sin(t*8)*0.8;
      if(P.legR) P.legR.rotation.x = Math.sin(t*8+1)*0.8;
      break;
    case 'moonwalk':
      m.position.x = ((t*0.5)%4)-2;
      if(P.legL) P.legL.rotation.x = Math.sin(t*6)*0.5;
      if(P.legR) P.legR.rotation.x = Math.sin(t*6+Math.PI)*0.5;
      m.rotation.y = -0.3;
      break;
    case 'crab':
      m.position.x = Math.sin(t*2)*1.5;
      if(P.armL) P.armL.rotation.z = Math.sin(t*4)*0.6 + 0.5;
      if(P.armR) P.armR.rotation.z = Math.sin(t*4+Math.PI)*0.6 - 0.5;
      m.rotation.y = Math.PI/2;
      break;
    case 'air_guitar':
      if(P.armL) P.armL.rotation.x = -0.8;
      if(P.armR) P.armR.rotation.x = Math.sin(t*12)*0.5 - 1.0;
      m.rotation.y = -0.4;
      break;
    case 'jump_rope':
      m.position.y = baseBob + Math.abs(Math.sin(t*8))*0.4;
      if(P.armL) P.armL.rotation.z = t*6;
      if(P.armR) P.armR.rotation.z = t*6;
      break;
    case 'spiral':
      m.rotation.y = t*6;
      m.position.y = baseBob + Math.sin(t*2)*0.3;
      if(P.armL) P.armL.rotation.z = 1.2;
      if(P.armR) P.armR.rotation.z = -1.2;
      break;
    case 'ground_roll':
      m.rotation.z = t*3;
      m.position.y = -0.6;
      break;
    case 'limb_tie':
      if(P.armL) P.armL.rotation.z = 2.5 + Math.sin(t)*0.3;
      if(P.armR) P.armR.rotation.z = -2.5 - Math.sin(t)*0.3;
      if(P.legL) P.legL.rotation.z = 1.5;
      if(P.legR) P.legR.rotation.z = -1.5;
      break;
    case 'head_fly':
      if(P.head){
        P.head.position.y = 1.28 + Math.sin(t*4)*0.5;
        P.head.rotation.z = t*2;
      }
      break;
    case 'shimmy':
      m.rotation.z = Math.sin(t*10)*0.25;
      if(P.armL) P.armL.rotation.z = Math.sin(t*10)*2.1 + 0.3;
      if(P.armR) P.armR.rotation.z = Math.sin(t*10+Math.PI)*2.1 - 0.3;
      if(P.chest) P.chest.position.y = 0.55 + Math.sin(t*10)*0.1;
      if(P.body) P.body.rotation.z = Math.sin(t*10)*0.15;
      break;
    case 'shake':
      m.rotation.z = Math.sin(t*20)*0.4;
      if(P.head) P.head.rotation.z = Math.sin(t*25)*0.6;
      m.position.x = Math.sin(t*15)*0.35;
      if(P.armL) P.armL.rotation.z = Math.sin(t*22)*1.3;
      if(P.armR) P.armR.rotation.z = Math.sin(t*22+1)*1.3;
      break;
    case 'vogue':
      if(P.armR) P.armR.rotation.z = -1.3 + Math.sin(t*3)*0.4;
      if(P.armL) P.armL.rotation.z = 1.3 - Math.sin(t*3)*0.4;
      m.rotation.y = Math.sin(t*2)*0.4;
      if(P.head) P.head.rotation.z = Math.sin(t*3)*0.15;
      break;
    case 'dab':
      if(P.armL) P.armL.rotation.z = -2.3;
      if(P.armR) P.armR.rotation.z = 1.1 + Math.sin(t*4)*0.2;
      if(P.head) P.head.rotation.z = -0.6;
      m.rotation.y = -0.35;
      break;
    case 'naenae':
      if(P.armR) P.armR.rotation.z = -1.5 + Math.sin(t*5)*0.5;
      if(P.armL) P.armL.rotation.z = 0.5;
      if(P.legR) P.legR.rotation.x = Math.sin(t*5)*0.6;
      m.rotation.z = Math.sin(t*5)*0.1;
      break;
    case 'macarena':
      const mt = (t*2)%4;
      if(P.armR){ P.armR.rotation.z = mt<1?0.8:mt<2?-0.8:mt<3?0.5:0; P.armR.rotation.x = mt>=2&&mt<3?-1:0; }
      if(P.armL){ P.armL.rotation.z = mt<1?-0.8:mt<2?0.8:mt<3?-0.5:0; P.armL.rotation.x = mt>=3?-1:0; }
      if(P.hip) P.hip.rotation.z = Math.sin(t*2)*0.3;
      break;
    case 'chicken':
      if(P.armL) P.armL.rotation.z = 0.8 + Math.sin(t*12)*0.4;
      if(P.armR) P.armR.rotation.z = -0.8 - Math.sin(t*12)*0.4;
      if(P.head) P.head.position.y = 1.28 + Math.sin(t*8)*0.08;
      m.position.y = baseBob + Math.abs(Math.sin(t*8))*0.1;
      break;
    case 'wiggle':
      m.rotation.z = Math.sin(t*12)*0.45;
      m.position.x = Math.sin(t*6)*0.4;
      if(P.armL) P.armL.rotation.z = Math.sin(t*12)*1.7;
      if(P.armR) P.armR.rotation.z = Math.sin(t*12+0.5)*1.7;
      if(P.legL) P.legL.rotation.x = Math.sin(t*12)*0.6;
      if(P.legR) P.legR.rotation.x = Math.sin(t*12+Math.PI)*0.6;
      if(P.chest) P.chest.position.y = 0.55 + Math.sin(t*12)*0.08;
      break;
    case 'gangnam':
      if(P.armL) P.armL.rotation.z = -1.5 + Math.sin(t*4)*0.3;
      if(P.armR) P.armR.rotation.x = Math.sin(t*4)*0.8;
      if(P.legL) P.legL.rotation.x = Math.sin(t*4)*0.4;
      m.position.y = baseBob + Math.abs(Math.sin(t*4))*0.15;
      break;
    case 'fortnite':
      const ft = (t*3)%4;
      if(P.armR) P.armR.rotation.z = ft<2? -0.5 : 0.8;
      if(P.armL) P.armL.rotation.z = ft<2? 0.5 : -0.8;
      if(P.legR) P.legR.rotation.x = ft>=2? 0.5 : 0;
      if(P.legL) P.legL.rotation.x = ft<2? 0.5 : 0;
      m.rotation.y = ft<2? 0.2 : -0.2;
      break;
    case 'orange_justice':
      if(P.armL) P.armL.rotation.z = Math.sin(t*8)*1.9 + 0.4;
      if(P.armR) P.armR.rotation.z = Math.sin(t*8+1)*1.9 - 0.4;
      if(P.legL) P.legL.rotation.x = Math.sin(t*4)*0.6;
      if(P.legR) P.legR.rotation.x = Math.sin(t*4+Math.PI)*0.6;
      m.rotation.z = Math.sin(t*8)*0.3;
      m.position.y = baseBob + Math.abs(Math.sin(t*8))*0.22;
      if(P.chest) P.chest.position.y = 0.55 + Math.sin(t*8)*0.1;
      break;
  }

  // ---------- 表情动画（魔性核心：眼睛/眉毛/嘴巴/舌头）----------
  // 眨眼 + 疯狂眯眼 + 偶尔翻白眼
  if(P.eyeL && P.eyeR){
    const blink = Math.sin(t*0.7) > 0.95 ? 0.06 : (Math.sin(t*1.3)>0.99?0.15:1);
    P.eyeL.scale.y = blink; P.eyeR.scale.y = blink;
    // 单眼 wink（随机触发）
    if(Math.sin(t*0.31)>0.995){ P.eyeL.scale.y = 0.08; }
    if(Math.sin(t*0.27)>0.997){ P.eyeR.scale.y = 0.08; }
  }
  // 瞳孔疯狂乱转（不同步、大幅度、偶尔翻白眼上翻）
  if(P.pupilL && P.pupilR){
    const pdxL = Math.sin(t*4.2)*0.06, pdyL = Math.cos(t*3.1)*0.05;
    const pdxR = Math.sin(t*5.7+1)*0.06, pdyR = Math.cos(t*2.3+2)*0.05;
    P.pupilL.position.x = -0.15 + pdxL; P.pupilL.position.y = 1.34 + pdyL;
    P.pupilR.position.x = 0.15 + pdxR; P.pupilR.position.y = 1.34 + pdyR;
    // 偶尔翻白眼
    if(Math.sin(t*0.43)>0.998){ P.pupilL.position.y = 1.4; P.pupilR.position.y = 1.4; }
  }
  // 眉毛乱跳（高低眉 + 倾斜）
  if(P.browL && P.browR){
    P.browL.position.y = 1.46 + Math.sin(t*7)*0.09;
    P.browR.position.y = 1.46 + Math.cos(t*5.3)*0.09;
    P.browL.rotation.z = Math.PI/2 + Math.sin(t*6)*0.5;
    P.browR.rotation.z = Math.PI/2 + Math.cos(t*4.1)*0.5;
  }
  // 嘴巴说话节奏（更夸张，配合节拍，偶尔张大）
  if(P.mouth){
    const talk = Math.abs(Math.sin(t*beatFreq*2));
    P.mouth.scale.y = 0.3 + talk*2.2;
    P.mouth.scale.x = 1 + Math.sin(t*7)*0.4 + talk*0.4;
  }
  // 舌头乱甩（伸出缩回 + 左右甩 + 上下）
  if(P.tongue){
    const tongueOut = Math.abs(Math.sin(t*3.7))*1.1;
    P.tongue.scale.setScalar(0.25 + tongueOut*1.1);
    P.tongue.position.y = 1.08 - tongueOut*0.06;
    P.tongue.rotation.z = Math.sin(t*9)*0.7;
    P.tongue.rotation.x = Math.sin(t*6)*0.3;
  }

  // 触手/翅膀等持续动画
  if(P.tentacles){
    P.tentacles.forEach((ten,i)=>{ ten.rotation.x = Math.sin(t*4+i)*0.4; ten.rotation.z = Math.sin(t*3+i*0.7)*0.3; });
  }
  if(P.wingL){ P.wingL.rotation.y = 0.5 + Math.sin(t*10)*0.4; }
  if(P.wingR){ P.wingR.rotation.y = -0.5 - Math.sin(t*10)*0.4; }
  if(P.fire){ P.fire.scale.y = 1 + Math.sin(t*15)*0.4; P.fire.position.y = 1.72 + Math.sin(t*10)*0.05; }
  if(P.cape){ P.cape.rotation.z = Math.sin(t*3)*0.15; }
  if(P.dress){ P.dress.rotation.z = Math.sin(t*3)*0.1; }
  if(P.veil){ P.veil.rotation.z = Math.sin(t*2)*0.06; }
  // 关节魔法火闪烁
  if(P.jointFlames){ P.jointFlames.forEach((f,i)=>{ f.scale.y = 1+Math.sin(t*12+i)*0.35; f.scale.x = 1+Math.cos(t*9+i)*0.2; }); }
  // 暗黑女巫环绕火球轨道
  if(P.fireOrbs){ P.fireOrbs.forEach(o=>{ const u=o.userData; u.a += u.sp*dt; o.position.x=Math.cos(u.a)*u.r; o.position.z=Math.sin(u.a)*u.r; o.position.y=u.y+Math.sin(t*3+u.a)*0.15; }); }
}

// 变异效果
function triggerMutation(m){
  const P = m.userData.parts;
  const type = pick(['stretch','invert','head_throw','jaw_drop','ghost','eye_pop','tongue_out','cross_eyes','rainbow','spin_head','big_mouth','tiny_head','derp_eyes','mega_tongue','body_flip']);
  switch(type){
    case 'stretch':
      m.userData.stretch = rand(1.5,2.4);
      setTimeout(()=>{ m.userData.stretch = 1; }, 600);
      break;
    case 'invert':
      m.traverse(o=>{ if(o.isMesh && o.material && o.material.color){ const c=o.material.color; c.setRGB(1-c.r,1-c.g,1-c.b);} });
      setTimeout(()=>{ m.traverse(o=>{ if(o.isMesh && o.material && o.material.color){ const c=o.material.color; c.setRGB(1-c.r,1-c.g,1-c.b);} }); }, 800);
      break;
    case 'head_throw':
      if(P.head){
        const origY = P.head.position.y;
        P.head.position.y = origY + 1.8;
        P.head.rotation.z = TAU;
        setTimeout(()=>{ P.head.position.y = origY; P.head.rotation.z=0; }, 700);
      }
      break;
    case 'jaw_drop':
      if(P.mouth){ P.mouth.scale.set(2,10,1); P.mouth.position.y=0.8; setTimeout(()=>{ P.mouth.scale.set(1,1,1); P.mouth.position.y=1.12; }, 500); }
      break;
    case 'ghost':
      m.traverse(o=>{ if(o.isMesh && o.material && o.material.opacity!==undefined){ o.material.transparent=true; o.material.opacity=0.3; }});
      setTimeout(()=>{ m.traverse(o=>{ if(o.isMesh && o.material && o.material.opacity!==undefined){ o.material.opacity=1; }}); }, 600);
      break;
    case 'eye_pop':
      if(P.eyeL && P.eyeR){
        P.eyeL.scale.setScalar(3.2); P.eyeR.scale.setScalar(3.2);
        P.eyeL.position.z += 0.15; P.eyeR.position.z += 0.15;
        setTimeout(()=>{ P.eyeL.scale.setScalar(1); P.eyeR.scale.setScalar(1); P.eyeL.position.z -= 0.15; P.eyeR.position.z -= 0.15; }, 600);
      }
      break;
    case 'tongue_out':
      if(P.mouth){
        P.mouth.scale.set(1.5,3,1);
        P.mouth.position.y = 0.98;
        setTimeout(()=>{ P.mouth.scale.set(1,1,1); P.mouth.position.y=1.12; }, 700);
      }
      break;
    case 'cross_eyes':
      if(P.pupilL && P.pupilR){
        P.pupilL.position.x = 0.05; P.pupilR.position.x = 0.05;
        setTimeout(()=>{ P.pupilL.position.x=-0.15; P.pupilR.position.x=0.15; }, 600);
      }
      break;
    case 'derp_eyes':
      if(P.eyeL && P.eyeR){
        P.eyeL.scale.set(1.5,0.3,1); P.eyeR.scale.set(0.3,1.5,1);
        setTimeout(()=>{ P.eyeL.scale.set(1,1,1); P.eyeR.scale.set(1,1,1); }, 600);
      }
      break;
    case 'mega_tongue':
      if(P.tongue){
        P.tongue.scale.setScalar(3);
        P.tongue.position.y = 0.9;
        setTimeout(()=>{ P.tongue.scale.setScalar(0.3); P.tongue.position.y=1.08; }, 700);
      }
      break;
    case 'body_flip':
      m.rotation.x = Math.PI;
      setTimeout(()=>{ m.rotation.x = 0; }, 700);
      break;
    case 'rainbow':
      m.traverse(o=>{ if(o.isMesh && o.material && o.material.color){ o.material.color.setHSL(Math.random(),1,0.55); } });
      setTimeout(()=>{ m.traverse(o=>{ if(o.isMesh && o.material && o.material.color){ o.material.color.setHSL(Math.random(),0.6,0.6); } }); }, 500);
      break;
    case 'spin_head':
      if(P.head){ P.head.rotation.y = t2Spin(P.head); }
      break;
    case 'big_mouth':
      if(P.mouth){ P.mouth.scale.setScalar(5); setTimeout(()=>{ P.mouth.scale.setScalar(1); }, 500); }
      break;
    case 'tiny_head':
      if(P.head){ P.head.scale.setScalar(0.3); setTimeout(()=>{ P.head.scale.setScalar(1); }, 600); }
      break;
  }
  spawnBarrage(pick(BARRAGE_MSGS));
}
function t2Spin(head){
  let r = 0;
  const iv = setInterval(()=>{ head.rotation.y = r; r += 0.5; }, 30);
  setTimeout(()=>{ clearInterval(iv); head.rotation.y = 0; }, 600);
  return 0;
}

// ---------- 克隆/分身 ----------
function spawnClone(){
  if(monsters.length>8) return;
  const type = pick(MONSTER_TYPES);
  const c = createMonster(type, Math.random);
  const angle = rand(0,TAU);
  const dist = rand(1.5,3);
  c.position.set(Math.cos(angle)*dist, rand(-0.5,0.5), Math.sin(angle)*dist - 1);
  c.scale.setScalar(rand(0.5,0.9));
  stageGroup.add(c);
  monsters.push(c);
  AudioEngine.whoosh();
  setTimeout(()=>{
    if(c.parent){ c.parent.remove(c); monsters=monsters.filter(x=>x!==c); disposeObject(c); }
  }, 6000);
}

function disposeObject(obj){
  obj.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
      else o.material.dispose();
    }
  });
}

// ---------- 暗黑暴走模式 ----------
let abstractValue = 0;
let frenzyActive = false;

function addAbstract(v){
  if(frenzyActive) return;
  abstractValue = clamp(abstractValue+v, 0, 100);
  document.getElementById('meter-fill').style.width = abstractValue+'%';
  if(abstractValue>=100){ triggerFrenzy(); }
}

function triggerFrenzy(){
  if(frenzyActive) return;
  frenzyActive = true;
  document.getElementById('stage').classList.add('fisheye');
  showBigMeme('DARK FRENZY!');
  AudioEngine.boom(); AudioEngine.scream();
  spawnBarrage('💀 DARK FRENZY 💀');
  for(let i=0;i<30;i++) setTimeout(()=>spawnBarrage(pick(BARRAGE_MSGS)), i*100);
  // 场景变墓地
  scene.background = new THREE.Color(0x1a0510);
  scene.fog.color.set(0x2a0a1a);
  ground.material.color.set(0x8a5a5a);
  // 生成墓碑
  for(let i=0;i<8;i++){
    const tomb = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.8,0.15), new THREE.MeshStandardMaterial({color:0x666666}));
    const a = (i/8)*TAU;
    tomb.position.set(Math.cos(a)*3.2, -0.8, Math.sin(a)*3.2);
    tomb.rotation.z = rand(-0.2,0.2);
    stageGroup.add(tomb);
    setTimeout(()=>{ if(tomb.parent) tomb.parent.remove(tomb); }, 15000);
  }
  // 镜头鱼眼震动
  cameraShake = 1.5;
  // 多分裂
  for(let i=0;i<5;i++) setTimeout(spawnClone, i*200);
  // 15秒后结束
  setTimeout(()=>{
    frenzyActive = false;
    abstractValue = 0;
    document.getElementById('meter-fill').style.width = '0%';
    document.getElementById('stage').classList.remove('fisheye');
    scene.background = new THREE.Color(COLORS.bg);
    scene.fog.color.set(COLORS.fog);
    ground.material.color.set(COLORS.ground);
  }, 15000);
}

// ---------- 镜头震动 ----------
let cameraShake = 0;
function applyShake(){
  // 电影感轻微摇摆作为基础位置
  const tt = clock ? clock.elapsedTime : 0;
  const baseX = Math.sin(tt*0.1)*0.3;
  const baseY = 1.2 + Math.sin(tt*0.13)*0.12;
  if(cameraShake>0.01){
    camera.position.x = baseX + rand(-cameraShake,cameraShake);
    camera.position.y = baseY + rand(-cameraShake,cameraShake)*0.5;
    cameraShake *= 0.9;
  } else {
    camera.position.x = lerp(camera.position.x, baseX, 0.1);
    camera.position.y = lerp(camera.position.y, baseY, 0.1);
  }
}

// ---------- 故障特效 ----------
function flashGlitch(){
  const g = document.getElementById('fx-glitch');
  g.style.opacity = '0.6';
  setTimeout(()=>{ g.style.opacity='0'; }, 80);
}

// ---------- 输入系统 ----------
let touchStartX=0, touchStartY=0, touchStartTime=0, lastTapTime=0, tapCount=0;
let longPressTimer=null;
let activeTouches=0;

function handleTap(){
  randomMove();
  addAbstract(5);
  cameraShake = 0.3;
  AudioEngine.spring();
  flashGlitch();
  spawnBarrage(pick(BARRAGE_MSGS));
}
function handleSwipe(dx,dy){
  if(Math.abs(dx)>Math.abs(dy)){ setMove(Math.random()<0.5?'moonwalk':'crab'); }
  else { setMove('spiral'); }
  addAbstract(6);
  AudioEngine.whoosh();
  cameraShake = 0.2;
  spawnBarrage(pick(['Moonwalk!','Crab walk!','Helicopter!','Slide!']));
}
function handleLongPress(){
  setMove(pick(['twerk','vogue','shimmy']));
  if(monster && monster.userData){
    monster.userData.stretch = 1.6;
    setTimeout(()=>{ if(monster) monster.userData.stretch=1; }, 500);
  }
  addAbstract(8);
  AudioEngine.rewind();
  spawnBarrage(pick(['Stretch!','Backbend!','Tentacle chaos!','Boing!']));
}
function handleDoubleFinger(){
  setMove('limb_tie');
  spawnClone();
  spawnClone();
  addAbstract(12);
  AudioEngine.zap();
  spawnBarrage(pick(['CLONE!','FUSION!','It\'s everywhere!','Multiply!']));
  showBigMeme('CLONE JUTSU!');
}
function handleMultiTap(){
  setMove('shake');
  AudioEngine.bpm = Math.min(180, AudioEngine.bpm+5);
  addAbstract(10);
  cameraShake = 0.5;
  spawnBarrage(pick(['CHAOS MODE!','Speed up!','Can\'t stop!','GOGOGO!']));
}
function handleShake(){
  triggerFrenzy();
}

// 触摸
const canvas = document.getElementById('game-canvas');
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  activeTouches = e.touches.length;
  if(activeTouches>=2){ handleDoubleFinger(); return; }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
  longPressTimer = setTimeout(handleLongPress, 500);
  // 连点检测
  const now = Date.now();
  if(now - lastTapTime < 300){ tapCount++; if(tapCount>=3){ handleMultiTap(); tapCount=0; } }
  else { tapCount=1; }
  lastTapTime = now;
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
  const touches = e.changedTouches[0];
  const dx = touches.clientX - touchStartX;
  const dy = touches.clientY - touchStartY;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const dur = Date.now() - touchStartTime;
  if(activeTouches>=2){ activeTouches=0; return; }
  if(dist>40 && dur<500){ handleSwipe(dx,dy); }
  else if(dur<300){ handleTap(); }
  activeTouches = 0;
}, {passive:false});

// 鼠标（桌面）
let mouseDown=false, mouseSX=0, mouseSY=0, mouseST=0;
canvas.addEventListener('mousedown', e=>{
  mouseDown=true; mouseSX=e.clientX; mouseSY=e.clientY; mouseST=Date.now();
  longPressTimer=setTimeout(handleLongPress,500);
});
canvas.addEventListener('mouseup', e=>{
  mouseDown=false;
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
  const dx=e.clientX-mouseSX, dy=e.clientY-mouseSY;
  const dist=Math.sqrt(dx*dx+dy*dy), dur=Date.now()-mouseST;
  if(dist>40 && dur<500) handleSwipe(dx,dy);
  else if(dur<300) handleTap();
});
canvas.addEventListener('mousemove', e=>{ if(!mouseDown) return; });

// 键盘
window.addEventListener('keydown', e=>{
  switch(e.code){
    case 'Space': e.preventDefault(); handleTap(); break;
    case 'ArrowLeft': handleSwipe(-100,0); break;
    case 'ArrowRight': handleSwipe(100,0); break;
    case 'ArrowDown': handleSwipe(0,100); break;
    case 'ArrowUp': handleLongPress(); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyB': toggleBGM(); break;
    case 'KeyF': triggerFrenzy(); break;
    case 'KeyC': changeCharacter(); break;
  }
});

// 摇手机（devicemotion）
let lastShake=0, shakeX=0,shakeY=0,shakeZ=0;
window.addEventListener('devicemotion', e=>{
  const a = e.accelerationIncludingGravity;
  if(!a) return;
  const dx=a.x-shakeX, dy=a.y-shakeY, dz=a.z-shakeZ;
  const speed = Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(speed>25 && Date.now()-lastShake>1000){
    handleShake();
    lastShake=Date.now();
  }
  shakeX=a.x; shakeY=a.y; shakeZ=a.z;
});

// ---------- UI 按钮 ----------
let muted = false;
function toggleMute(){
  muted = !muted;
  AudioEngine.setMuted(muted);
  document.getElementById('btn-mute').textContent = muted?'🔊':'🔇';
  if(muted) AudioEngine.stopBGM();
}
function toggleBGM(){
  const playing = AudioEngine.toggleBGM();
  document.getElementById('btn-bgm').textContent = playing?'🎶':'🎵';
  if(playing) AudioEngine.resume();
}
document.getElementById('btn-mute').addEventListener('click', toggleMute);
document.getElementById('btn-bgm').addEventListener('click', toggleBGM);
document.getElementById('btn-frenzy').addEventListener('click', ()=>{ triggerFrenzy(); });
document.getElementById('btn-share').addEventListener('click', openShare);
document.getElementById('btn-change').addEventListener('click', changeCharacter);
document.getElementById('btn-record').addEventListener('click', toggleRecord);
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('close-share').addEventListener('click', ()=>{ document.getElementById('share-modal').style.display='none'; });
document.getElementById('copy-code').addEventListener('click', copyCode);
document.getElementById('gen-gif').addEventListener('click', genGif);

let currentType;
function changeCharacter(){
  if(monster){ stageGroup.remove(monster); disposeObject(monster); }
  let nt; do{ nt=pick(MONSTER_TYPES); }while(nt===currentType && MONSTER_TYPES.length>1);
  currentType = nt;
  monster = createMonster(currentType, Math.random);
  monster.position.set(0,0,0);
  stageGroup.add(monster);
  showBigMeme(MONSTER_NAMES[currentType]);
  AudioEngine.whoosh();
  spawnBarrage('Swap: '+MONSTER_NAMES[currentType]);
  addAbstract(3);
}

// ---------- 录制 & 分享 ----------
let recording = false, recordStart = 0;
function toggleRecord(){
  recording = !recording;
  const ind = document.getElementById('rec-indicator');
  if(recording){
    recordStart = Date.now();
    ind.style.display = 'flex';
    showBigMeme('REC START');
  } else {
    ind.style.display = 'none';
    showBigMeme('REC DONE!');
    setTimeout(openShare, 600);
  }
}
function openShare(){
  const code = genChallengeCode();
  document.getElementById('share-code').textContent = code;
  document.getElementById('share-modal').style.display = 'flex';
  window._challengeCode = code;
}
function copyCode(){
  const code = window._challengeCode || document.getElementById('share-code').textContent;
  const ta = document.createElement('textarea');
  ta.value = '万圣夜怪物狂欢曲挑战码: '+code+'\n同样的舞步，不同的怪物，一起发疯跳到散！';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showBigMeme('COPIED!'); }catch(e){ showBigMeme('Copy failed'); }
  document.body.removeChild(ta);
}
function genGif(){
  // 简化版：截图并下载
  showBigMeme('Saving snapshot...');
  renderer.render(scene,camera);
  try{
    const url = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = 'monster_dance_'+Date.now()+'.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showBigMeme('SAVED!');
  }catch(e){ showBigMeme('Snapshot failed'); }
}

// ---------- 自动挂机 ----------
let idleTimer = null;
function startIdleAuto(){
  if(idleTimer) clearInterval(idleTimer);
  idleTimer = setInterval(()=>{
    if(document.hidden) return;
    // 挂机自己发疯
    if(Math.random()<0.7){
      randomMove();
      spawnBarrage(pick(BARRAGE_MSGS));
      addAbstract(4);
    }
    if(Math.random()<0.15){ spawnClone(); }
    if(Math.random()<0.1){ triggerMutation(monster); }
    if(Math.random()<0.05){ flashGlitch(); }
  }, 3000);
}

// ---------- 主循环 ----------
let beatTimer = 0;
function animate(){
  requestAnimationFrame(animate);
  if(!webglAvailable || !renderer) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 节拍
  beatTimer += dt;
  const beatDur = 60/AudioEngine.bpm;
  if(beatTimer >= beatDur){
    beatTimer -= beatDur;
    AudioEngine.playBeat();
  }

  // 萤火虫 / 幽灵粒子（漂浮 + 脉动透明度）
  if(fireflies){
    const pos = fireflies.geometry.attributes.position.array;
    for(let i=0;i<fireflyData.length;i++){
      const d = fireflyData[i];
      pos[i*3]   = d.x + Math.sin(t*d.sp+d.phase)*d.amp;
      pos[i*3+1] = d.y + Math.cos(t*d.sp*0.7+d.phase)*d.amp*0.6;
      pos[i*3+2] = d.z + Math.sin(t*d.sp*0.5+d.phase*1.3)*d.amp;
    }
    fireflies.geometry.attributes.position.needsUpdate = true;
    fireflies.material.opacity = 0.6 + Math.sin(t*1.5)*0.25;
  }
  // 飘落枯叶（下落 + 漂移 + 旋转）
  if(leaves){
    const pos = leaves.geometry.attributes.position.array;
    for(let i=0;i<leafData.length;i++){
      const d = leafData[i];
      pos[i*3]   += d.vx*dt;
      pos[i*3+1] -= dt*0.6;
      d.rot += d.vr*dt;
      if(pos[i*3+1] < -1.2){ pos[i*3+1] = 6; pos[i*3] = rand(-9,9); pos[i*3+2] = rand(-7,5); }
      if(pos[i*3] < -10) pos[i*3]=10; if(pos[i*3] > 10) pos[i*3]=-10;
    }
    leaves.geometry.attributes.position.needsUpdate = true;
  }
  // 蝙蝠群飞行（环形 / 随机轨迹 + 上下扑动）
  if(bats){
    batsArr.forEach(b=>{
      const a = b.ph + t*b.sp;
      b.mesh.position.x = b.cx + Math.cos(a)*b.rad;
      b.mesh.position.z = b.cz + Math.sin(a)*b.rad;
      b.mesh.position.y = b.cy + Math.sin(t*b.yp+b.ph)*0.5;
      b.mesh.rotation.y = -a + Math.PI/2;
      b.mesh.rotation.z = Math.sin(t*8+b.ph)*0.4; // 扑翅
    });
  }
  // 坩埚冒泡（绿色小球上升后消失）
  for(let c=0;c<bubblesArr.length;c++){
    const bubs = bubblesArr[c];
    bubs.forEach(b=>{
      const cyc = (t*b.sp + b.phase) % 1;
      b.mesh.position.y = cyc*0.5;
      b.mesh.scale.setScalar(1 - cyc);
      b.mesh.material.opacity = 0.8 * (1 - cyc);
      b.mesh.visible = cyc < 0.95;
    });
  }
  // 南瓜灯光闪烁
  for(let i=0;i<pumpkinLights.length;i++){
    pumpkinLights[i].intensity = 0.5 + Math.sin(t*7+i*1.7)*0.2 + Math.sin(t*23+i)*0.08;
  }

  // 动作切换
  moveTime += dt;
  if(moveTime >= moveDuration){
    randomMove();
  }

  // 动画
  if(monster) animateMonster(monster, dt, t, beatTimer);
  monsters.forEach((m,i)=>{
    animateMonster(m, dt, t+i*0.3, beatTimer);
    m.rotation.y += dt*0.5;
  });

  applyShake();

  renderer.render(scene, camera);
}

// ---------- 启动 ----------
function startGame(){
  document.getElementById('start-screen').style.display = 'none';
  AudioEngine.init();
  AudioEngine.resume();
  const ok = initThree();
  if(!ok){
    // WebGL 不可用：仅显示提示，不启动 3D 游戏逻辑
    return;
  }
  changeCharacter();
  startIdleAuto();
  animate();
  // 自动开启背景音乐
  setTimeout(()=>{ AudioEngine.startBGM(); document.getElementById('btn-bgm').textContent='🎶'; }, 300);
  // 开场欢迎
  setTimeout(()=>{ showBigMeme('万圣狂欢夜！'); }, 500);
  setTimeout(()=>{ spawnBarrage('不给糖就捣蛋！'); }, 1000);
}

// 暴露到全局便于调试
window.MonsterDance = { triggerFrenzy, changeCharacter, setMove, randomMove, spawnClone };

})();
</script>
