<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>万圣夜：怪物狂欢曲 Halloween Meme Mash</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0612; font-family:"Segoe UI","Microsoft YaHei",sans-serif; touch-action:none; }
  #game-canvas { display:block; width:100%; height:100%; touch-action:none; }

  /* 弹幕 */
  #barrage { position:absolute; inset:0; pointer-events:none; z-index:20; overflow:hidden; }
  .barrage-item { position:absolute; white-space:nowrap; font-weight:900; font-size:20px; color:#fff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 0 0 8px #ff6600; animation: bslide linear forwards; }
  @keyframes bslide { from { transform:translateX(110vw);} to { transform:translateX(-110vw);} }

  /* 大字 */
  #bigmeme { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:25; opacity:0; }
  #bigmeme span { font-size:clamp(36px,12vw,100px); font-weight:900; color:#c8a030;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #ff6600, 0 0 25px #c8a030; transform:rotate(-6deg); }

  /* 疯狂值条 */
  #meter-wrap { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:30;
    width:55%; max-width:260px; height:12px; background:rgba(0,0,0,0.6); border:2px solid #c8a030;
    border-radius:10px; overflow:hidden; box-shadow:0 0 10px #c8a030; }
  #meter-fill { height:100%; width:0%; background:linear-gradient(90deg,#3a8c3a,#c8a030,#ff6600);
    transition:width 0.15s; box-shadow:0 0 8px #fff; }
  #meter-label { position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:11px; color:#c8a030;
    text-shadow:1px 1px 0 #000; white-space:nowrap; font-weight:bold; }

  /* UI */
  #ui { position:absolute; inset:0; z-index:40; pointer-events:none; }
  .btn { pointer-events:auto; display:flex; align-items:center; justify-content:center;
    background:rgba(20,10,30,0.8); border:2px solid #c8a030; color:#fff; border-radius:50%;
    width:48px; height:48px; font-size:20px; cursor:pointer; box-shadow:0 0 10px #c8a03044;
    transition:transform 0.1s; }
  .btn:active { transform:scale(0.85); background:rgba(200,160,48,0.3); }
  .btn-row { position:absolute; display:flex; gap:8px; }
  #top-left { top:12px; left:12px; }
  #top-right { top:12px; right:12px; }
  #bottom-left { bottom:calc(16px + env(safe-area-inset-bottom)); left:12px; }
  #bottom-right { bottom:calc(16px + env(safe-area-inset-bottom)); right:12px; }

  /* 开始界面 */
  #start-screen { position:absolute; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, #2a1a0a 0%, #05020a 80%);
    padding:20px; text-align:center; }
  #start-screen h1 { font-size:clamp(28px,9vw,56px); color:#c8a030; font-weight:900; line-height:1.1;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #ff6600, 0 0 20px #c8a03088; margin-bottom:6px; transform:rotate(-2deg); }
  #start-screen .sub { font-size:clamp(13px,4.5vw,18px); color:#ff6600; margin-bottom:24px; text-shadow:2px 2px 0 #000; }
  #start-screen .slogan { font-size:clamp(12px,3.8vw,16px); color:#3a8c3a; margin-bottom:30px; max-width:300px; line-height:1.6; }
  #start-btn { pointer-events:auto; padding:14px 40px; font-size:22px; font-weight:900; color:#fff;
    background:linear-gradient(135deg,#ff6600,#c8a030); border:none; border-radius:36px; cursor:pointer;
    box-shadow:0 0 20px #ff660088, 0 5px 0 #5a2a00; animation: pulse 1.2s ease-in-out infinite; }
  #start-btn:active { transform:translateY(4px); box-shadow:0 0 10px #ff6600, 0 1px 0 #5a2a00; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  .hint { font-size:11px; color:#888; margin-top:16px; max-width:280px; line-height:1.6; }

  /* 录制指示 */
  #rec-indicator { position:absolute; top:48px; left:50%; transform:translateX(-50%); z-index:35;
    display:none; align-items:center; gap:5px; color:#ff3344; font-weight:bold; font-size:12px; text-shadow:1px 1px 0 #000; }
  #rec-dot { width:10px; height:10px; background:#ff3344; border-radius:50%; animation: blink 0.8s infinite; }
  @keyframes blink { 50%{opacity:0.3;} }

  /* 分享弹窗 */
  #share-modal { position:absolute; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.85); padding:20px; }
  #share-box { background:#1a0a2a; border:2px solid #c8a030; border-radius:16px; padding:22px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 0 25px #c8a030; }
  #share-box h3 { color:#c8a030; margin-bottom:10px; font-size:18px; }
  #share-code { font-size:26px; font-weight:900; color:#3a8c3a; letter-spacing:3px; margin:14px 0; font-family:monospace;
    background:#000; padding:8px; border-radius:8px; }
  .share-btn { padding:10px 16px; margin:5px; font-size:13px; font-weight:bold; color:#fff;
    background:linear-gradient(135deg,#ff6600,#c8a030); border:none; border-radius:18px; cursor:pointer; }
  #close-share { background:#444; }

  /* 横屏提示 */
  #rotate-hint { display:none; position:absolute; inset:0; z-index:300; background:#000; color:#c8a030;
    align-items:center; justify-content:center; flex-direction:column; font-size:16px; text-align:center; padding:30px; }
  @media (orientation:landscape) and (max-height:500px) { #rotate-hint { display:flex; } }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="meter-wrap"><div id="meter-label">🎃 疯狂值 MADNESS</div><div id="meter-fill"></div></div>
<div id="rec-indicator"><div id="rec-dot"></div> REC...</div>
<div id="barrage"></div>
<div id="bigmeme"><span id="bigmeme-text"></span></div>

<div id="ui">
  <div id="top-left" class="btn-row"><button class="btn" id="btn-mute" title="静音">🔇</button></div>
  <div id="top-right" class="btn-row"><button class="btn" id="btn-frenzy" title="暴走">💀</button></div>
  <div id="bottom-left" class="btn-row"><button class="btn" id="btn-change" title="换角色">🔄</button></div>
  <div id="bottom-right" class="btn-row"><button class="btn" id="btn-share" title="分享">📤</button></div>
</div>

<div id="start-screen">
  <h1>万圣夜<br>怪物狂欢曲</h1>
  <div class="sub">🎃 抽象魔性解压派对 🦇</div>
  <div class="slogan">万圣节不捣蛋，<br>今晚一起发疯跳到散。</div>
  <button id="start-btn">进入狂欢 ▶</button>
  <div class="hint">📱 戳他/拖他/长按/连点/双指<br>⌨️ 空格=抽搐 · 方向键=甩 · M=静音 · F=暴走</div>
</div>

<div id="share-modal">
  <div id="share-box">
    <h3>📤 分享你的狂欢</h3>
    <div style="color:#888;font-size:12px;">挑战码（同角色不同起舞）</div>
    <div id="share-code">------</div>
    <button class="share-btn" id="copy-code">📋 复制码</button>
    <button class="share-btn" id="gen-gif">📸 截图保存</button>
    <button class="share-btn" id="close-share">关闭</button>
    <div style="color:#555;font-size:10px;margin-top:10px;">截图分享到抖音/TikTok/B站</div>
  </div>
</div>

<div id="rotate-hint"><div style="font-size:40px;">📱↻</div><div style="margin-top:12px;">竖屏体验更佳</div></div>

<script>
/* ============================================================
   万圣夜：怪物狂欢曲 — 2D Meme Edition
   Canvas 2D + Web Audio API | 表情包贴纸风
   ============================================================ */
(function(){
'use strict';

// ========== 工具 ==========
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => t * t * (3 - 2 * t);

// ========== Canvas ==========
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ========== 音频引擎 ==========
const AudioEngine = {
  ctx: null, bpm: 128, muted: false, bgmPlaying: false,
  masterGain: null, bgmTimer: null, bgmStep: 0,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.4;
    this.masterGain.connect(this.ctx.destination);
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m) {
    this.muted = m;
    if (this.masterGain) this.masterGain.gain.value = m ? 0 : 0.4;
  },
  // 骨头敲击
  boneKnock() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(60, t + 0.08);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.connect(gain).connect(this.masterGain);
    osc.start(t); osc.stop(t + 0.12);
  },
  // 鬼叫/whoosh
  ghostWhisper() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource();
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.5, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    noise.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800; filter.Q.value = 3;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.15, t + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    noise.connect(filter).connect(gain).connect(this.masterGain);
    noise.start(t); noise.stop(t + 0.5);
  },
  // 南瓜pop
  pumpkinPop() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain).connect(this.masterGain);
    osc.start(t); osc.stop(t + 0.15);
  },
  // 抽搐音
  twitch() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square'; osc.frequency.value = rand(300, 800);
      const st = t + i * 0.04;
      gain.gain.setValueAtTime(0.15, st);
      gain.gain.exponentialRampToValueAtTime(0.001, st + 0.05);
      osc.connect(gain).connect(this.masterGain);
      osc.start(st); osc.stop(st + 0.06);
    }
  },
  // 爆炸音
  explosion() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource();
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.8, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 0.5);
    noise.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 400;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    noise.connect(filter).connect(gain).connect(this.masterGain);
    noise.start(t); noise.stop(t + 0.8);
    // 低音
    const osc = this.ctx.createOscillator();
    const og = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(100, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
    og.gain.setValueAtTime(0.3, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(og).connect(this.masterGain);
    osc.start(t); osc.stop(t + 0.5);
  },
  // 节拍
  beat() { this.boneKnock(); },
  // BGM
  startBGM() {
    if (!this.ctx || this.bgmPlaying) return;
    this.bgmPlaying = true;
    this.bgmStep = 0;
    const bassNotes = [55, 0, 55, 0, 73, 0, 65, 0, 55, 0, 55, 0, 49, 0, 58, 0];
    const leadNotes = [220, 0, 0, 0, 261, 0, 0, 0, 233, 0, 0, 0, 196, 0, 220, 0];
    const stepDur = 60 / this.bpm / 4;
    const playStep = () => {
      if (!this.bgmPlaying) return;
      const t = this.ctx.currentTime;
      const bs = bassNotes[this.bgmStep % 16];
      if (bs) {
        const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.value = bs;
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(g).connect(this.masterGain); osc.start(t); osc.stop(t + 0.3);
      }
      const ls = leadNotes[this.bgmStep % 16];
      if (ls) {
        const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = ls;
        g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(g).connect(this.masterGain); osc.start(t); osc.stop(t + 0.2);
      }
      this.bgmStep++;
      this.bgmTimer = setTimeout(playStep, stepDur * 1000);
    };
    playStep();
  },
  stopBGM() { this.bgmPlaying = false; if (this.bgmTimer) clearTimeout(this.bgmTimer); },
  toggleBGM() {
    if (this.bgmPlaying) { this.stopBGM(); return false; }
    this.resume(); this.startBGM(); return true;
  }
};

// ========== 角色：表情包贴纸风格 ==========
const CHARACTERS = [
  { id: 'pumpkin', name: '南瓜头', emoji: '🎃' },
  { id: 'ghost',   name: '幽灵鬼', emoji: '👻' },
  { id: 'vampire', name: '吸血鬼', emoji: '🧛' },
  { id: 'frank',   name: '科学怪人', emoji: '🧟' },
  { id: 'witch',   name: '黑魔女', emoji: '🧙' },
  { id: 'bat',     name: '蝙蝠精', emoji: '🦇' },
  { id: 'mummy',   name: '木乃伊', emoji: '🤕' },
  { id: 'cat',     name: '黑猫妖', emoji: '🐱' },
];
let currentCharIdx = 0;

// 角色绘制函数 —— 表情包风格：大脸+夸张五官+简单四肢
const CharDraw = {
  pumpkin(ctx, t, parts) {
    // 南瓜头：橙色椭圆脸 + 雕刻三角眼 + 锯齿嘴
    ctx.fillStyle = '#ff7700';
    ctx.beginPath(); ctx.ellipse(0, 0, 80, 70, 0, 0, TAU); ctx.fill();
    // 南瓜棱
    ctx.strokeStyle = '#cc5500'; ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.ellipse(0, 0, 80 - i * 2, 70 - i * 2, 0, -0.3, 0.3);
      ctx.stroke();
    }
    // 茎
    ctx.fillStyle = '#335522';
    ctx.fillRect(-8, -85, 16, 20);
    // 三角眼（发光）
    ctx.fillStyle = '#fff800';
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(-35, -15); ctx.lineTo(-15, -15); ctx.lineTo(-25, 5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(15, -15); ctx.lineTo(35, -15); ctx.lineTo(25, 5); ctx.fill();
    ctx.shadowBlur = 0;
    // 瞳孔（跟随动作）
    ctx.fillStyle = '#000';
    const px = parts.pupilX || 0, py = parts.pupilY || 0;
    ctx.beginPath(); ctx.arc(-25 + px, -8 + py, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(25 + px, -8 + py, 4, 0, TAU); ctx.fill();
    // 锯齿嘴
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(-30, 25);
    for (let i = 0; i <= 6; i++) { ctx.lineTo(-30 + i * 10, 25 + (i % 2 ? 12 : 0)); }
    ctx.lineTo(30, 25); ctx.closePath(); ctx.fill();
    // 舌头
    if (parts.tongue > 0.1) {
      ctx.fillStyle = '#ff3366';
      ctx.beginPath(); ctx.ellipse(0, 35 + parts.tongue * 15, 10, 15 * parts.tongue, 0, 0, TAU); ctx.fill();
    }
  },

  ghost(ctx, t, parts) {
    // 幽灵：白色半透明体 + 波浪底部 + 大黑眼
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.shadowColor = '#4a6fa5'; ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(0, -10, 65, Math.PI, 0);
    ctx.lineTo(65, 50);
    // 波浪底
    for (let i = 5; i >= 0; i--) {
      const x = -65 + i * 26;
      ctx.quadraticCurveTo(x + 13, 65, x, 50);
    }
    ctx.lineTo(-65, -10);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    // 大黑眼
    ctx.fillStyle = '#000';
    const px = parts.pupilX * 1.5 || 0, py = parts.pupilY * 1.5 || 0;
    ctx.beginPath(); ctx.ellipse(-22 + px, -20 + py, 12, 16, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(22 + px, -20 + py, 12, 16, 0, 0, TAU); ctx.fill();
    // 白色高光
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-19 + px, -25 + py, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(25 + px, -25 + py, 4, 0, TAU); ctx.fill();
    // 嘴 O 形
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, 15, 12, 15 + parts.mouthOpen * 10, 0, 0, TAU); ctx.fill();
  },

  vampire(ctx, t, parts) {
    // 吸血鬼：苍白脸 + 黑眼圈 + 红眼 + 尖牙 + 黑披风
    // 披风
    ctx.fillStyle = '#1a0011';
    ctx.beginPath();
    ctx.moveTo(-75, -30); ctx.lineTo(-90, 60); ctx.lineTo(90, 60); ctx.lineTo(75, -30);
    ctx.quadraticCurveTo(0, -70, -75, -30); ctx.fill();
    // 脸
    ctx.fillStyle = '#e8ddcc';
    ctx.beginPath(); ctx.ellipse(0, -5, 55, 65, 0, 0, TAU); ctx.fill();
    // 头发
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(0, -50, 55, 35, 0, 0, Math.PI); ctx.fill();
    // 黑眼圈
    ctx.fillStyle = 'rgba(100,40,40,0.5)';
    ctx.beginPath(); ctx.ellipse(-22, -10, 18, 12, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(22, -10, 18, 12, 0, 0, TAU); ctx.fill();
    // 红眼
    ctx.fillStyle = '#ff0000'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 10;
    const px = parts.pupilX || 0, py = parts.pupilY || 0;
    ctx.beginPath(); ctx.arc(-22 + px, -10 + py, 7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(22 + px, -10 + py, 7, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // 尖牙
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-8, 20); ctx.lineTo(-4, 35); ctx.lineTo(0, 20); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(4, 35); ctx.lineTo(8, 20); ctx.fill();
    // 嘴
    if (parts.mouthOpen > 0.1) {
      ctx.fillStyle = '#440011';
      ctx.beginPath(); ctx.ellipse(0, 22, 15, 8 * parts.mouthOpen, 0, 0, TAU); ctx.fill();
    }
  },

  frank(ctx, t, parts) {
    // 科学怪人：绿色方头 + 螺丝 + 平顶头 + 缝线
    ctx.fillStyle = '#55aa44';
    ctx.fillRect(-50, -60, 100, 110);
    // 平顶
    ctx.fillStyle = '#449933';
    ctx.fillRect(-55, -65, 110, 15);
    // 螺丝
    ctx.fillStyle = '#888';
    ctx.beginPath(); ctx.arc(-50, 0, 6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(50, 0, 6, 0, TAU); ctx.fill();
    // 螺丝纹
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-54, 0); ctx.lineTo(-46, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(46, 0); ctx.lineTo(54, 0); ctx.stroke();
    // 缝线
    ctx.strokeStyle = '#224'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-15, -50); ctx.lineTo(-15, -20); ctx.stroke();
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-20, -45 + i * 8); ctx.lineTo(-10, -45 + i * 8); ctx.stroke(); }
    // 眼
    ctx.fillStyle = '#fff';
    const px = parts.pupilX || 0, py = parts.pupilY || 0;
    ctx.beginPath(); ctx.arc(-22, -10, 12, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(22, -10, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-22 + px, -10 + py, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(22 + px, -10 + py, 5, 0, TAU); ctx.fill();
    // 嘴
    ctx.strokeStyle = '#224'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, 25); ctx.lineTo(20, 25); ctx.stroke();
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-20 + i * 10, 22); ctx.lineTo(-20 + i * 10, 28); ctx.stroke(); }
    // 眉
    ctx.fillStyle = '#224';
    ctx.fillRect(-32, -28, 20, 5); ctx.fillRect(12, -28, 20, 5);
  },

  witch(ctx, t, parts) {
    // 黑魔女：绿脸 + 尖帽 + 黑眼 + 角
    // 帽
    ctx.fillStyle = '#1a0a2a';
    ctx.beginPath(); ctx.moveTo(-50, -55); ctx.lineTo(50, -55); ctx.lineTo(10, -120); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -55, 65, 12, 0, 0, TAU); ctx.fill();
    // 绿脸
    ctx.fillStyle = '#88bb44';
    ctx.beginPath(); ctx.ellipse(0, 0, 50, 58, 0, 0, TAU); ctx.fill();
    // 角
    ctx.fillStyle = '#1a0a2a';
    ctx.beginPath(); ctx.moveTo(-40, -30); ctx.lineTo(-50, -60); ctx.lineTo(-30, -35); ctx.fill();
    ctx.beginPath(); ctx.moveTo(40, -30); ctx.lineTo(50, -60); ctx.lineTo(30, -35); ctx.fill();
    // 眼
    ctx.fillStyle = '#000';
    const px = parts.pupilX * 1.5 || 0, py = parts.pupilY * 1.5 || 0;
    ctx.beginPath(); ctx.ellipse(-18 + px, -5 + py, 10, 14, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18 + px, -5 + py, 10, 14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3a8c3a'; ctx.shadowColor = '#3a8c3a'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(-18 + px, -5 + py, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(18 + px, -5 + py, 3, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // 邪笑
    ctx.strokeStyle = '#1a0a2a'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-20, 30); ctx.quadraticCurveTo(0, 45 + parts.mouthOpen * 15, 20, 30);
    ctx.stroke();
    // 舌
    if (parts.tongue > 0.1) {
      ctx.fillStyle = '#cc3366';
      ctx.beginPath(); ctx.ellipse(0, 40, 8, 12 * parts.tongue, 0, 0, TAU); ctx.fill();
    }
  },

  bat(ctx, t, parts) {
    // 蝙蝠精：黑色身体 + 大翅膀 + 红眼 + 尖耳
    ctx.fillStyle = '#1a0011';
    // 翅膀（随拍打）
    const wingFlap = Math.sin(t * 8) * 0.3;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.quadraticCurveTo(-60, -30 + wingFlap * 40, -80, 20);
    ctx.quadraticCurveTo(-40, 10, 0, 20);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.quadraticCurveTo(60, -30 + wingFlap * 40, 80, 20);
    ctx.quadraticCurveTo(40, 10, 0, 20);
    ctx.fill();
    // 身体
    ctx.beginPath(); ctx.ellipse(0, 0, 25, 35, 0, 0, TAU); ctx.fill();
    // 耳
    ctx.beginPath(); ctx.moveTo(-15, -25); ctx.lineTo(-20, -45); ctx.lineTo(-5, -25); ctx.fill();
    ctx.beginPath(); ctx.moveTo(15, -25); ctx.lineTo(20, -45); ctx.lineTo(5, -25); ctx.fill();
    // 红眼
    ctx.fillStyle = '#ff0000'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(-10, -8, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -8, 5, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // 尖牙
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-3, 10); ctx.lineTo(0, 20); ctx.lineTo(3, 10); ctx.fill();
  },

  mummy(ctx, t, parts) {
    // 木乃伊：绷带缠绕 + 露出眼睛
    ctx.fillStyle = '#e8dcc0';
    ctx.beginPath(); ctx.ellipse(0, 0, 55, 65, 0, 0, TAU); ctx.fill();
    // 绷带条
    ctx.strokeStyle = '#c8b890'; ctx.lineWidth = 6;
    for (let i = -5; i <= 5; i++) {
      ctx.beginPath();
      ctx.moveTo(-55, i * 12);
      ctx.quadraticCurveTo(0, i * 12 + 5, 55, i * 12);
      ctx.stroke();
    }
    // 露眼缝隙
    ctx.fillStyle = '#000';
    const px = parts.pupilX || 0;
    ctx.beginPath(); ctx.ellipse(-20, -10 + (parts.pupilY || 0), 8, 5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -10 + (parts.pupilY || 0), 8, 5, 0, 0, TAU); ctx.fill();
    // 发光
    ctx.fillStyle = '#88cc44'; ctx.shadowColor = '#88cc44'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(-20 + px, -10, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(20 + px, -10, 3, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // 嘴缝
    if (parts.mouthOpen > 0.1) {
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(0, 25, 15, 6 * parts.mouthOpen, 0, 0, TAU); ctx.fill();
    }
  },

  cat(ctx, t, parts) {
    // 黑猫妖：猫头 + 尖耳 + 绿眼 + 诡笑
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(0, 0, 55, 50, 0, 0, TAU); ctx.fill();
    // 耳
    ctx.beginPath(); ctx.moveTo(-40, -30); ctx.lineTo(-45, -60); ctx.lineTo(-20, -35); ctx.fill();
    ctx.beginPath(); ctx.moveTo(40, -30); ctx.lineTo(45, -60); ctx.lineTo(20, -35); ctx.fill();
    // 耳内
    ctx.fillStyle = '#ff6600';
    ctx.beginPath(); ctx.moveTo(-38, -35); ctx.lineTo(-40, -52); ctx.lineTo(-25, -38); ctx.fill();
    ctx.beginPath(); ctx.moveTo(38, -35); ctx.lineTo(40, -52); ctx.lineTo(25, -38); ctx.fill();
    // 绿眼
    ctx.fillStyle = '#3aff3a'; ctx.shadowColor = '#3aff3a'; ctx.shadowBlur = 12;
    const px = parts.pupilX || 0, py = parts.pupilY || 0;
    ctx.beginPath(); ctx.ellipse(-18 + px, -5 + py, 14, 18, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18 + px, -5 + py, 14, 18, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // 瞳孔（竖瞳）
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(-18 + px, -5 + py, 3, 14, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18 + px, -5 + py, 3, 14, 0, 0, TAU); ctx.fill();
    // 鼻
    ctx.fillStyle = '#ff6600';
    ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(5, 12); ctx.lineTo(0, 18); ctx.fill();
    // 诡笑 + 胡须
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-15, 22); ctx.quadraticCurveTo(0, 30 + parts.mouthOpen * 10, 15, 22);
    ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-55, 10 + i * 8); ctx.lineTo(-25, 12 + i * 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(55, 10 + i * 8); ctx.lineTo(25, 12 + i * 6); ctx.stroke();
    }
  },
};

      break;
    case 'warp':
      warpAmount = 2;
      showBigMeme('扭 曲！');
      break;
    case 'teleport':
      character.x = rand(100, W - 100);
      character.y = rand(100, H - 200);
      spawnParticles(character.x, character.y, 20);
      showBigMeme('瞬 移！');
      break;
    case 'face_swap':
      const oldIdx = currentCharIdx;
      do { currentCharIdx = randi(0, CHARACTERS.length - 1); } while (currentCharIdx === oldIdx);
      character.type = CHARACTERS[currentCharIdx].id;
      character.name = CHARACTERS[currentCharIdx].name;
      spawnParticles(character.x, character.y, 25);
      showBigMeme('变脸！');
      AudioEngine.ghostWhisper();
      break;
    case 'rain_money':
      for (let i = 0; i < 20; i++) {

      }
      showBigMeme('下 钱 了！');

}

// ========== 交互处理 ==========
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let activeTouches = 0, longPressTimer = null;
let tapCount = 0, lastTapTime = 0;
let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;

function getCharPos() { return { x: character.x, y: character.y }; }

function handleTap() {
  AudioEngine.twitch();
  setMove('twitch');
  character.twitchTimer = 0.4;
  character.scaleY = 0.6; character.scaleX = 1.5;
  character.eyePop = 1.2;
  spawnParticles(character.x, character.y + 30, 8);
  addMadness(4);
  if (Math.random() < 0.3) spawnBarrage(pick(BARRAGE_MSGS));
  if (Math.random() < 0.2) triggerChaos();
}

function handleSwipe(dx, dy) {
  AudioEngine.ghostWhisper();
  const angle = Math.atan2(dy, dx);
  character.vx = Math.cos(angle) * 500;
  character.vy = Math.sin(angle) * 500;
  character.rotV = (dx > 0 ? 1 : -1) * 8;
  setMove('spin');
  spawnParticles(character.x, character.y, 15);
  addMadness(6);
  if (Math.random() < 0.3) { screenShake = 0.5; }
  if (Math.random() < 0.15) triggerChaos();
}

function handleLongPress() {
  AudioEngine.pumpkinPop();
  setMove('stretch');
  character.targetScaleY = 2.5; character.targetScaleX = 0.4;
  character.tongue = 1.5;
  character.eyePop = 1;
  spawnParticles(character.x, character.y, 20, '#ff3366');
  addMadness(10);
  showBigMeme('拉～长～');
  if (Math.random() < 0.3) triggerChaos();
}

function handleDoubleFinger() {
  AudioEngine.explosion();
  setMove('flip');
  character.flipping = true; character.flipProgress = 0;
  spawnParticles(character.x, character.y, 40);
  addMadness(18);
  showBigMeme('翻 转！');
  screenShake = 0.8;
  flashAmount = 0.5;
  if (Math.random() < 0.4) triggerChaos();
}

function handleMultiTap() {
  AudioEngine.boneKnock();
  setMove('spaz');
  character.shakeX = 25; character.shakeY = 25;
  character.eyePop = 2;
  spawnParticles(character.x, character.y, 30);
  addMadness(15);
  showBigMeme('疯狂抽搐！');
  spawnBarrage('魔性全开');
  triggerChaos();
}

function handleShake() {
  triggerFrenzy();
}

// ========== 输入 ==========
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  activeTouches = e.touches.length;
  if (activeTouches >= 2) { handleDoubleFinger(); return; }
  const tch = e.touches[0];
  touchStartX = tch.clientX; touchStartY = tch.clientY;
  touchStartTime = Date.now();
  // 检测是否点中角色
  const dx = tch.clientX - character.x;
  const dy = tch.clientY - character.y;
  if (Math.abs(dx) < 100 && Math.abs(dy) < 100) {
    isDragging = true;
    dragOffsetX = dx; dragOffsetY = dy;
  }
  longPressTimer = setTimeout(handleLongPress, 500);
  const now = Date.now();
  if (now - lastTapTime < 300) { tapCount++; if (tapCount >= 3) { handleMultiTap(); tapCount = 0; } }
  else { tapCount = 1; }
  lastTapTime = now;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (activeTouches >= 2 || !isDragging) return;
  const tch = e.touches[0];
  character.x = tch.clientX - dragOffsetX;
  character.y = tch.clientY - dragOffsetY;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  const tch = e.changedTouches[0];
  const dx = tch.clientX - touchStartX;
  const dy = tch.clientY - touchStartY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const dur = Date.now() - touchStartTime;
  isDragging = false;
  if (activeTouches >= 2) { activeTouches = 0; return; }
  if (dist > 40 && dur < 500) { handleSwipe(dx, dy); }
  else if (dur < 300) { handleTap(); }
  activeTouches = 0;
}, { passive: false });

// 鼠标
let mouseDown = false, mouseSX = 0, mouseSY = 0, mouseST = 0;
canvas.addEventListener('mousedown', e => {
  mouseDown = true; mouseSX = e.clientX; mouseSY = e.clientY; mouseST = Date.now();
  const dx = e.clientX - character.x, dy = e.clientY - character.y;
  if (Math.abs(dx) < 100 && Math.abs(dy) < 100) { isDragging = true; dragOffsetX = dx; dragOffsetY = dy; }
  longPressTimer = setTimeout(handleLongPress, 500);
});
canvas.addEventListener('mouseup', e => {
  mouseDown = false; isDragging = false;
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  const dx = e.clientX - mouseSX, dy = e.clientY - mouseSY;
  const dist = Math.sqrt(dx * dx + dy * dy), dur = Date.now() - mouseST;
  if (dist > 40 && dur < 500) handleSwipe(dx, dy);
  else if (dur < 300) handleTap();
});
canvas.addEventListener('mousemove', e => {
  if (!mouseDown || !isDragging) return;
  character.x = e.clientX - dragOffsetX;
  character.y = e.clientY - dragOffsetY;
});

// 键盘
window.addEventListener('keydown', e => {
  switch (e.code) {
    case 'Space': e.preventDefault(); handleTap(); break;
    case 'ArrowLeft': handleSwipe(-100, 0); break;
    case 'ArrowRight': handleSwipe(100, 0); break;
    case 'ArrowDown': handleSwipe(0, 100); break;
    case 'ArrowUp': handleLongPress(); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyF': triggerFrenzy(); break;
    case 'KeyC': changeCharacter(); break;
  }
});

// 摇手机
let lastShake = 0, shakeX = 0, shakeY = 0, shakeZ = 0;
window.addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const dx = a.x - shakeX, dy = a.y - shakeY, dz = a.z - shakeZ;
  const speed = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (speed > 25 && Date.now() - lastShake > 1000) { handleShake(); lastShake = Date.now(); }
  shakeX = a.x; shakeY = a.y; shakeZ = a.z;
});

function genChallengeCode() {
  let s = '';
  for (let i = 0; i < 6; i++) s += 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[randi(0, 30)];
  return s;
}

function changeCharacter() {
  currentCharIdx = (currentCharIdx + 1) % CHARACTERS.length;
  character = createCharacter();
  AudioEngine.ghostWhisper();
  spawnParticles(character.x, character.y, 15);
  showBigMeme(CHARACTERS[currentCharIdx].name);
  spawnBarrage('换：' + CHARACTERS[currentCharIdx].name);
  addMadness(3);
}

// ========== 挂机自动 ==========
let idleTimer = null;
function startIdleAuto() {
  if (idleTimer) clearInterval(idleTimer);
  idleTimer = setInterval(() => {
    if (document.hidden) return;
    // 自动换动作（更频繁）
    if (Math.random() < 0.8) { randomMove(); addMadness(2); }
    // 弹幕
    if (Math.random() < 0.5) spawnBarrage(pick(BARRAGE_MSGS));
    // 自动触发混乱事件
    if (Math.random() < 0.3) triggerChaos();
    // 自动触发小抽搐
    if (Math.random() < 0.25) { handleTap(); }
    // 随机粒子
    if (Math.random() < 0.3) { spawnParticles(rand(0, W), rand(0, H), 8); }
  }, 1500);
}

// ========== 主循环 ==========
let lastTime = 0, beatTimer = 0, totalTime = 0;
let started = false;

function drawScene(dt, t) {
  // 背景渐变
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0612');
  grad.addColorStop(0.5, '#1a0a2a');
  grad.addColorStop(1, '#2a1a0a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 月亮
  const m = scene.moon;
  m.glow = Math.sin(t * 0.5) * 0.2 + 0.8;
  ctx.shadowColor = '#fff8dc'; ctx.shadowBlur = 40 * m.glow;
  ctx.fillStyle = '#fff8dc';
  ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  // 月坑
  ctx.fillStyle = 'rgba(200,180,120,0.3)';
  ctx.beginPath(); ctx.arc(m.x - 15, m.y - 10, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(m.x + 12, m.y + 8, 10, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(m.x - 5, m.y + 15, 6, 0, TAU); ctx.fill();

  // 星星
  for (const s of scene.stars) {
    s.tw += dt * 2;
    const a = 0.3 + Math.sin(s.tw) * 0.3;
    ctx.fillStyle = `rgba(255,255,200,${a})`;
    ctx.fillRect(s.x - s.s / 2, s.y - s.s / 2, s.s, s.s);
  }

  // 萤火虫
  for (const f of scene.fireflies) {
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 0 || f.x > W) f.vx *= -1;
    if (f.y < 0 || f.y > H) f.vy *= -1;
    f.glow += dt * 3;
    const a = 0.3 + Math.sin(f.glow) * 0.3;
    ctx.fillStyle = `rgba(200,255,100,${a})`;
    ctx.shadowColor = '#88ff44'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 蝙蝠
  for (const b of scene.bats) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.wing += dt * 10;
    if (b.x < 0) b.vx = Math.abs(b.vx);
    if (b.x > W) b.vx = -Math.abs(b.vx);
    if (b.y < 30) b.vy = Math.abs(b.vy);
    if (b.y > H * 0.5) b.vy = -Math.abs(b.vy);
    // 画蝙蝠
    const wf = Math.sin(b.wing) * 0.3;
    ctx.fillStyle = '#1a0011';
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.quadraticCurveTo(b.x - b.size, b.y - b.size * wf * 2, b.x - b.size * 1.5, b.y);
    ctx.quadraticCurveTo(b.x - b.size, b.y + b.size * 0.5, b.x, b.y + b.size * 0.3);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.quadraticCurveTo(b.x + b.size, b.y - b.size * wf * 2, b.x + b.size * 1.5, b.y);
    ctx.quadraticCurveTo(b.x + b.size, b.y + b.size * 0.5, b.x, b.y + b.size * 0.3);
    ctx.fill();
  }

  // 枯叶
  for (const l of scene.leaves) {
    l.x += l.vx * dt; l.y += l.vy * dt; l.rot += l.rotV * dt;
    if (l.y > H) { l.y = -20; l.x = rand(0, W); }
    if (l.x < 0) l.x = W; if (l.x > W) l.x = 0;
    ctx.save();
    ctx.translate(l.x, l.y); ctx.rotate(l.rot);
    ctx.fillStyle = l.color;
    ctx.beginPath(); ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 地面
  ctx.fillStyle = '#1a0a00';
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  // 墓碑
  for (const ts of scene.tombstones) {
    ctx.save();
    ctx.translate(ts.x, ts.y); ctx.rotate(ts.lean);
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(-ts.w / 2, -ts.h, ts.w, ts.h);
    ctx.beginPath(); ctx.arc(0, -ts.h, ts.w / 2, Math.PI, 0); ctx.fill();
    // RIP
    ctx.fillStyle = '#222'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
    ctx.fillText('RIP', 0, -ts.h * 0.6);
    ctx.restore();
  }

  // 南瓜灯
  for (const pk of scene.pumpkins) {
    pk.glow += dt * 2;
    const g = 0.5 + Math.sin(pk.glow) * 0.3;
    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 20 * g;
    ctx.fillStyle = '#cc6600';
    ctx.beginPath(); ctx.ellipse(pk.x, pk.y, pk.r, pk.r * 0.8, 0, 0, TAU); ctx.fill();
    // 脸
    ctx.fillStyle = '#fff800';
    ctx.shadowBlur = 10 * g;
    ctx.beginPath(); ctx.moveTo(pk.x - pk.r * 0.4, pk.y - pk.r * 0.2); ctx.lineTo(pk.x - pk.r * 0.2, pk.y - pk.r * 0.2); ctx.lineTo(pk.x - pk.r * 0.3, pk.y); ctx.fill();
    ctx.beginPath(); ctx.moveTo(pk.x + pk.r * 0.2, pk.y - pk.r * 0.2); ctx.lineTo(pk.x + pk.r * 0.4, pk.y - pk.r * 0.2); ctx.lineTo(pk.x + pk.r * 0.3, pk.y); ctx.fill();
    ctx.fillRect(pk.x - pk.r * 0.3, pk.y + pk.r * 0.2, pk.r * 0.6, pk.r * 0.15);
    ctx.shadowBlur = 0;
  }

  // 蛛网（角落）
  ctx.strokeStyle = 'rgba(200,200,200,0.15)'; ctx.lineWidth = 1;
  for (const w of scene.spiderWebs) {
    const cx = w.x, cy = w.y;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60);
      ctx.stroke();
    }
    for (let r = 15; r <= 50; r += 12) {
      ctx.beginPath();
      for (let i = 0; i <= 8; i++) {
        const a = (i / 8) * TAU;
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
}

function drawCharacter(dt, t) {
  if (!character) return;

  // 物理更新
  character.x += character.vx * dt;
  character.y += character.vy * dt;
  character.vx *= 0.92;
  character.vy *= 0.92;
  // 边界
  character.x = clamp(character.x, 80, W - 80);
  character.y = clamp(character.y, 100, H - 100);
  // 重力回中
  character.vy += (H * 0.45 - character.y) * 0.5 * dt;
  character.vx += (W / 2 - character.x) * 0.3 * dt;

  character.rot += character.rotV * dt;
  character.rotV *= 0.9;

  // 缩放回弹
  character.scaleX = lerp(character.scaleX, character.targetScaleX, dt * 8);
  character.scaleY = lerp(character.scaleY, character.targetScaleY, dt * 8);
  character.targetScaleX = lerp(character.targetScaleX, 1, dt * 4);
  character.targetScaleY = lerp(character.targetScaleY, 1, dt * 4);

  // 果冻挤压
  const beatFreq = AudioEngine.bpm * TAU / 60;
  const beatPunch = Math.pow(1 - (beatTimer / (60 / AudioEngine.bpm)), 3);
  const squash = 1 - beatPunch * 0.15;
  const stretch = 1 + beatPunch * 0.15;

  // 动作动画 —— 全部大幅加强
  moveTime += dt;
  if (moveTime >= moveDuration) randomMove();

  let extraRot = 0, extraX = 0, extraY = 0;
  let sX = character.scaleX * stretch, sY = character.scaleY * squash;
  let drawHue = 0;

  switch (currentMove) {
    case 'twitch':
      character.twitchTimer -= dt;
      if (character.twitchTimer > 0) {
        extraX = rand(-20, 20); extraY = rand(-15, 15); extraRot = rand(-0.4, 0.4);
        sX *= rand(0.7, 1.4); sY *= rand(0.7, 1.4);
        character.eyePop = rand(0.5, 1.5);
      } else { character.eyePop = 0; }
      break;
    case 'wiggle':
      extraRot = Math.sin(t * 10) * 0.6;
      sX *= 1 + Math.sin(t * 8) * 0.25;
      sY *= 1 - Math.sin(t * 8) * 0.15;
      break;
    case 'spin':
      extraRot = t * 12;
      sX *= 1 + Math.abs(Math.sin(t * 6)) * 0.2;
      break;
    case 'bounce':
      extraY = Math.abs(Math.sin(t * beatFreq * 2)) * -50;
      sY *= 1 + Math.sin(t * beatFreq * 2) * 0.25;
      sX *= 1 - Math.sin(t * beatFreq * 2) * 0.15;
      if (Math.sin(t * beatFreq * 2) > 0.95) character.eyePop = 0.8;
      break;
    case 'shake':
      extraX = Math.sin(t * 30) * 20;
      extraY = Math.cos(t * 25) * 10;
      extraRot = Math.sin(t * 20) * 0.4;
      sX *= 1 + Math.sin(t * 15) * 0.15;
      break;
    case 'flip':
      character.flipping = true;
      character.flipProgress += dt * 4;
      if (character.flipProgress >= 1) { character.flipping = false; setMove('bounce'); }
      extraRot = character.flipProgress * Math.PI * 2;
      extraY = Math.sin(character.flipProgress * Math.PI) * -60;
      break;
    case 'wobble':
      sX *= 1 + Math.sin(t * 6) * 0.4;
      sY *= 1 - Math.sin(t * 6) * 0.3;
      extraRot = Math.sin(t * 4) * 0.4;
      extraX = Math.sin(t * 5) * 15;
      break;
    case 'stretch':
      sY *= 1 + Math.sin(t * 3) * 0.8 + 0.5;
      sX *= 0.6;
      character.tongue = Math.min(1.5, character.tongue + dt * 2);
      break;
    case 'spaz':
      extraX = rand(-30, 30); extraY = rand(-25, 25);
      extraRot = rand(-0.8, 0.8);
      sX *= rand(0.5, 1.8); sY *= rand(0.5, 1.8);
      character.eyePop = rand(0, 2);
      character.pupilX = rand(-15, 15); character.pupilY = rand(-15, 15);
      break;
    case 'jelly':
      sX *= 1 + Math.sin(t * 7) * 0.35;
      sY *= 1 - Math.sin(t * 7) * 0.3;
      extraRot = Math.sin(t * 3) * 0.2;
      character.elasticPhase = t;
      break;
    case 'breakdance':
      extraRot = t * 8 + Math.sin(t * 4) * 0.5;
      extraX = Math.sin(t * 5) * 30;
      extraY = Math.abs(Math.cos(t * 5)) * -20;
      sX *= 1 + Math.sin(t * 10) * 0.2;
      break;
    case 'headspin':
      character.spinningHead = true;
      character.headSpinAngle = t * 15;
      extraY = -10;
      sX *= 0.9; sY *= 0.9;
      break;
    case 'inflate':
      character.inflation = (Math.sin(t * 4) + 1) * 0.5;
      sX *= 1 + character.inflation * 1.5;
      sY *= 1 + character.inflation * 1.5;
      if (character.inflation > 0.8) character.eyePop = 1;
      break;
    case 'dab':
      extraRot = -0.3 + Math.sin(t * 8) * 0.1;
      extraX = 20;
      sX *= 1.1; sY *= 1.1;
      break;
    case 'idle':
    default:
      // idle 也要魔性：不停小幅度乱动
      extraY = Math.sin(t * 4) * 8 + Math.sin(t * 7) * 4;
      extraX = Math.sin(t * 3) * 5;
      extraRot = Math.sin(t * 2.5) * 0.15;
      sX *= 1 + Math.sin(t * 6) * 0.08;
      sY *= 1 - Math.sin(t * 6) * 0.05;
      break;
  }

  if (!['stretch', 'headspin'].includes(currentMove)) {
    character.spinningHead = false;
  }
  if (!['stretch'].includes(currentMove)) {
    character.tongue = Math.max(0, character.tongue - dt * 1.5);
  }
  character.eyePop = Math.max(0, character.eyePop - dt * 3);

  // 表情 —— 更疯狂
  character.pupilX = Math.sin(t * 5) * 8 + Math.sin(t * 11) * 5 + (frenzyActive ? rand(-5, 5) : 0);
  character.pupilY = Math.cos(t * 3) * 6 + Math.sin(t * 8) * 4 + (frenzyActive ? rand(-5, 5) : 0);
  character.mouthOpen = (Math.sin(t * beatFreq * 2) + 1) * 0.5;
  character.browAngle = Math.sin(t * 6) * 0.3;

  // 彩虹色
  if (rainbowAmount > 0) { drawHue = (t * 360 * 3) % 360; }

  // 暴走模式 —— 更加疯狂
  if (frenzyActive) {
    extraX += rand(-15, 15); extraY += rand(-15, 15);
    extraRot += rand(-0.4, 0.4);
    sX *= rand(0.7, 1.4); sY *= rand(0.7, 1.4);
    character.pupilX = rand(-15, 15); character.pupilY = rand(-15, 15);
    character.mouthOpen = 1;
    character.tongue = 1.2;
    character.eyePop = 1.5;
    drawHue = (t * 720) % 360;
  }

  // glitch 偏移
  if (glitchAmount > 0.01) {
    character.glitchOffset.x = rand(-10, 10) * glitchAmount;
    character.glitchOffset.y = rand(-5, 5) * glitchAmount;
    extraX += character.glitchOffset.x;
  }

  // 残影 —— 更密更久
  if (['spin', 'spaz', 'flip', 'breakdance', 'jelly'].includes(currentMove) || frenzyActive || rainbowAmount > 0.5) {
    character.afterimages.push({ x: character.x + extraX, y: character.y + extraY, rot: character.rot + extraRot, life: 0.4, hue: drawHue, sX, sY });
  }
  character.afterimages = character.afterimages.filter(a => { a.life -= dt; return a.life > 0; });
  // 残影最多保留15个
  if (character.afterimages.length > 15) character.afterimages.shift();
  for (const a of character.afterimages) {
    ctx.save();
    ctx.globalAlpha = a.life * 0.4;
    if (a.hue) ctx.filter = `hue-rotate(${a.hue}deg)`;
    ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.scale(a.sX, a.sY);
    const drawFn = CharDraw[character.type];
    if (drawFn) drawFn(ctx, t, character);
    ctx.restore();
  }
  ctx.filter = 'none';

  // 画角色 —— 带 hue-rotate 和 glitch
  ctx.save();
  if (drawHue) ctx.filter = `hue-rotate(${drawHue}deg)`;
  ctx.translate(character.x + extraX, character.y + extraY);
  ctx.rotate(character.rot + extraRot);
  ctx.scale(sX, sY);
  const drawFn = CharDraw[character.type];
  if (drawFn) drawFn(ctx, t, character);
  ctx.restore();
  ctx.filter = 'none';
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += p.gravity * dt; p.vx *= 0.98;
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    const a = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function animate(ts) {
  requestAnimationFrame(animate);
  if (!started) return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  totalTime += dt;

  // 节拍
  beatTimer += dt;
  const beatDur = 60 / AudioEngine.bpm;
  if (beatTimer >= beatDur) {
    beatTimer -= beatDur;
    AudioEngine.beat();
    // 每拍随机小概率触发混乱事件
    if (Math.random() < 0.12) triggerChaos();
  }

  // 混乱事件自动触发（每隔几秒随机来一次）
  chaosTimer += dt;
  if (chaosTimer > 5 && Math.random() < 0.02) {
    triggerChaos();
    chaosTimer = 0;
  }

  // 屏幕特效衰减
  screenShake = Math.max(0, screenShake - dt * 3);
  glitchAmount = Math.max(0, glitchAmount - dt * 2);
  rainbowAmount = Math.max(0, rainbowAmount - dt);
  flashAmount = Math.max(0, flashAmount - dt * 3);
  invertAmount = Math.max(0, invertAmount - dt * 2);
  warpAmount = Math.max(0, warpAmount - dt);

  // 屏幕震动
  if (screenShake > 0.01) {
    screenShakeX = rand(-1, 1) * screenShake * 15;
    screenShakeY = rand(-1, 1) * screenShake * 15;
  } else { screenShakeX = 0; screenShakeY = 0; }

  // 应用屏幕变换
  ctx.save();
  ctx.translate(screenShakeX, screenShakeY);

  // 颜色反转
  if (invertAmount > 0.01) { ctx.filter = `invert(${invertAmount})`; }

  drawScene(dt, totalTime);
  drawCharacter(dt, totalTime);
  drawParticles(dt);

  ctx.filter = 'none';
  ctx.restore();

  // 闪光覆盖
  if (flashAmount > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flashAmount * 0.6})`;
    ctx.fillRect(0, 0, W, H);
  }

  // glitch 扫描线
  if (glitchAmount > 0.01) {
    for (let i = 0; i < 5; i++) {
      const y = rand(0, H);
      ctx.fillStyle = `rgba(${rand(200, 255)|0},0,${rand(100, 200)|0},${glitchAmount * 0.3})`;
      ctx.fillRect(0, y, W, rand(2, 8));
    }
    // RGB 分离效果
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = `rgba(255,0,0,${glitchAmount * 0.15})`;
    ctx.fillRect(rand(-5, 5), 0, W, H);
    ctx.fillStyle = `rgba(0,255,255,${glitchAmount * 0.15})`;
    ctx.fillRect(rand(-5, 5), 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // 暴走计时
  if (frenzyActive) {
    frenzyTimer -= dt;
    if (frenzyTimer <= 0) frenzyActive = false;
  }

  // 疯狂值衰减
  madness = Math.max(0, madness - dt * 2);
  document.getElementById('meter-fill').style.width = madness + '%';
}

// ========== 启动 ==========
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  AudioEngine.init();
  AudioEngine.resume();
  scene.init();
  character = createCharacter();
  startIdleAuto();
  started = true;
  lastTime = performance.now();
  animate(lastTime);
  setTimeout(() => { AudioEngine.startBGM(); }, 300);
  setTimeout(() => { showBigMeme('万圣夜发疯！'); }, 500);
  setTimeout(() => { spawnBarrage('万圣节不捣蛋，今晚一起发疯跳到散'); }, 1000);
}

window.MonsterDance = { triggerFrenzy, changeCharacter, setMove, randomMove };

})();
</script>
