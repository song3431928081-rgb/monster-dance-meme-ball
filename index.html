<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>怪物大乱摇：暗黑Meme舞会</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; touch-action:none; }
  #game-root { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game-canvas { display:block; width:100%; height:100%; touch-action:none; }
  /* 竖屏舞台容器 */
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:#0a0612; }
  /* 扫描线 + CRT 覆盖层 */
  #fx-overlay { position:absolute; inset:0; pointer-events:none; z-index:30; mix-blend-mode:screen; opacity:0.35;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px, transparent 1px, transparent 3px); }
  #fx-vignette { position:absolute; inset:0; pointer-events:none; z-index:31;
    box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.85); }
  #fx-glitch { position:absolute; inset:0; pointer-events:none; z-index:29; opacity:0;
    background:linear-gradient(90deg, rgba(255,0,80,0.15), rgba(0,255,200,0.15)); mix-blend-mode:screen; }
  /* 鱼眼 */
  .fisheye #stage { border-radius:24px; }
  /* 弹幕层 */
  #barrage { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
  .barrage-item { position:absolute; white-space:nowrap; font-weight:900; font-size:22px; color:#fff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 0 0 12px #ff00aa; animation: bslide linear forwards; }
  @keyframes bslide { from { transform:translateX(110vw);} to { transform:translateX(-110vw);} }
  /* 大字梗 */
  #bigmeme { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:45; opacity:0; }
  #bigmeme span { font-size:clamp(40px,14vw,120px); font-weight:900; color:#fff;
    text-shadow: 4px 4px 0 #000, -2px -2px 0 #ff00aa, 0 0 30px #00ffcc; transform:rotate(-8deg); }
  /* 抽象值条 */
  #meter-wrap { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:50;
    width:60%; max-width:300px; height:14px; background:rgba(0,0,0,0.6); border:2px solid #ff00aa;
    border-radius:10px; overflow:hidden; box-shadow:0 0 12px #ff00aa; }
  #meter-fill { height:100%; width:0%; background:linear-gradient(90deg,#00ffcc,#ff00aa,#ffcc00);
    transition:width 0.2s; box-shadow:0 0 10px #fff; }
  #meter-label { position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:12px; color:#fff;
    text-shadow:1px 1px 0 #000; white-space:nowrap; font-weight:bold; }
  /* UI 按钮 */
  #ui { position:absolute; inset:0; z-index:60; pointer-events:none; }
  .btn { pointer-events:auto; display:flex; align-items:center; justify-content:center;
    background:rgba(20,10,30,0.75); border:2px solid #00ffcc; color:#fff; border-radius:50%;
    width:54px; height:54px; font-size:22px; cursor:pointer; box-shadow:0 0 12px #00ffcc, inset 0 0 8px rgba(0,255,204,0.3);
    transition:transform 0.1s, background 0.2s; }
  .btn:active { transform:scale(0.88); background:rgba(255,0,170,0.6); }
  .btn-row { position:absolute; display:flex; gap:10px; }
  #top-left { top:14px; left:14px; }
  #top-right { top:14px; right:14px; }
  #bottom-center { bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); }
  #bottom-left { bottom:calc(18px + env(safe-area-inset-bottom)); left:14px; }
  #bottom-right { bottom:calc(18px + env(safe-area-inset-bottom)); right:14px; }
  .btn .label { font-size:10px; position:absolute; bottom:-16px; color:#fff; text-shadow:1px 1px 0 #000; white-space:nowrap; }
  .btn-wrap { position:relative; }
  /* 开始界面 */
  #start-screen { position:absolute; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, #2a0a3a 0%, #05020a 80%);
    padding:20px; text-align:center; }
  #start-screen h1 { font-size:clamp(28px,9vw,56px); color:#fff; font-weight:900; line-height:1.1;
    text-shadow: 3px 3px 0 #ff00aa, -2px -2px 0 #00ffcc, 0 0 24px #ff00aa; margin-bottom:8px; transform:rotate(-2deg); }
  #start-screen .sub { font-size:clamp(14px,4.5vw,20px); color:#ffcc00; margin-bottom:30px; text-shadow:2px 2px 0 #000; }
  #start-screen .slogan { font-size:clamp(13px,4vw,17px); color:#00ffcc; margin-bottom:36px; max-width:320px; line-height:1.6; }
  #start-btn { pointer-events:auto; padding:16px 44px; font-size:24px; font-weight:900; color:#fff;
    background:linear-gradient(135deg,#ff00aa,#00ffcc); border:none; border-radius:40px; cursor:pointer;
    box-shadow:0 0 24px #ff00aa, 0 6px 0 #5a0040; animation: pulse 1.2s ease-in-out infinite; }
  #start-btn:active { transform:translateY(4px); box-shadow:0 0 12px #ff00aa, 0 2px 0 #5a0040; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .hint { font-size:12px; color:#aaa; margin-top:18px; max-width:280px; line-height:1.6; }
  /* 录制指示 */
  #rec-indicator { position:absolute; top:54px; left:50%; transform:translateX(-50%); z-index:55;
    display:none; align-items:center; gap:6px; color:#ff3344; font-weight:bold; font-size:13px; text-shadow:1px 1px 0 #000; }
  #rec-dot { width:12px; height:12px; background:#ff3344; border-radius:50%; animation: blink 0.8s infinite; }
  @keyframes blink { 50%{opacity:0.3;} }
  /* 挑战码弹窗 */
  #share-modal { position:absolute; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.8); padding:20px; }
  #share-box { background:#1a0a2a; border:2px solid #00ffcc; border-radius:16px; padding:24px; max-width:340px; width:100%;
    text-align:center; box-shadow:0 0 30px #00ffcc; }
  #share-box h3 { color:#fff; margin-bottom:10px; font-size:20px; }
  #share-code { font-size:30px; font-weight:900; color:#ffcc00; letter-spacing:4px; margin:16px 0; font-family:monospace;
    background:#000; padding:10px; border-radius:8px; }
  .share-btn { padding:12px 18px; margin:6px; font-size:14px; font-weight:bold; color:#fff;
    background:linear-gradient(135deg,#ff00aa,#00ffcc); border:none; border-radius:20px; cursor:pointer; }
  #close-share { background:#444; }
  /* 横屏提示 */
  #rotate-hint { display:none; position:absolute; inset:0; z-index:300; background:#000; color:#fff;
    align-items:center; justify-content:center; flex-direction:column; font-size:18px; text-align:center; padding:30px; }
  @media (orientation:landscape) and (max-height:500px) {
    #rotate-hint { display:flex; }
  }
</style>
</head>
<body>
<div id="game-root">
  <div id="stage">
    <canvas id="game-canvas"></canvas>

    <!-- 抽象值条 -->
    <div id="meter-wrap"><div id="meter-label">🔥 抽象值</div><div id="meter-fill"></div></div>

    <!-- 录制指示 -->
    <div id="rec-indicator"><div id="rec-dot"></div> 录制中...</div>

    <!-- 特效层 -->
    <div id="fx-glitch"></div>
    <div id="fx-overlay"></div>

    <!-- 弹幕 -->
    <div id="barrage"></div>
    <!-- 大字梗 -->

    <!-- UI -->

      </div>
      <div id="bottom-center" class="btn-row">
        <div class="btn-wrap"><button class="btn" id="btn-record" title="录制" style="width:64px;height:64px;font-size:26px;">⏺️</button></div>
      </div>
    </div>

    <!-- 开始界面 -->
    <div id="start-screen">
      <h1>怪物大乱摇</h1>
      <div class="sub">🎃 暗黑 Meme 舞会 🦇</div>
      <div class="slogan">不评分，不通关，只发疯。<br>今天你摇了吗？</div>
      <button id="start-btn">开始发疯 ▶</button>
      <div class="hint">📱 点按/滑动/长按/双指/连点/摇手机<br>⌨️ 空格抽搐 · 方向键滑动 · ↑长按 · M静音</div>
    </div>

    <!-- 分享弹窗 -->
    <div id="share-modal">
      <div id="share-box">
        <h3>📤 分享你的抽象舞</h3>

        <div id="share-code">------</div>
        <button class="share-btn" id="copy-code">复制挑战码</button>
        <button class="share-btn" id="gen-gif">导出表情包</button>
        <button class="share-btn" id="close-share">关闭</button>
        <div style="color:#666;font-size:11px;margin-top:12px;">提示：可截图分享到抖音/TikTok/B站</div>
      </div>

    <!-- 横屏提示 -->
    <div id="rotate-hint">
      <div style="font-size:50px;">📱↻</div>

  </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* ============================================================
   《怪物大乱摇：暗黑Meme舞会》
   单文件 HTML + Three.js + Web Audio API
   ============================================================ */
(function(){
'use strict';

// ---------- 全局工具 ----------
const TAU = Math.PI*2;
const rand = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;

// ---------- 挑战码生成 ----------
function genChallengeCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[randi(0,chars.length)];
  return s;
}
function seededRandom(seed){
  let h = 2166136261>>>0;
  for(let i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619); }
  return function(){ h += 0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
}

// ---------- 音频引擎（Web Audio API 程序化生成）----------
const AudioEngine = {
  ctx:null, master:null, muted:false, bpm:140,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    }catch(e){ console.warn('Audio unavailable',e); }
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value=m?0:0.35; },
  // 基础音色
  tone(freq,dur,type='square',vol=0.3,slide=0){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol=0.3,filter=800){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, buf=this.ctx.createBuffer(1,this.ctx.sampleRate*dur,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filter;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur);
  },
  // 音效库
  kick(){ this.tone(60,0.15,'sine',0.5,0.3); this.noise(0.05,0.1,400); },
  snare(){ this.noise(0.12,0.25,2000); this.tone(180,0.05,'triangle',0.15); },
  hat(){ this.noise(0.04,0.12,8000); },
  bass(){ this.tone(55,0.2,'sawtooth',0.3,0.5); },
  spring(){ this.tone(400,0.25,'sine',0.2,3); this.tone(600,0.25,'sine',0.15,0.3); },
  bark(){ this.tone(140,0.12,'sawtooth',0.25,0.6); this.noise(0.1,0.15,500); },
  scream(){ this.tone(800,0.3,'sawtooth',0.2,0.2); this.noise(0.3,0.1,3000); },
  fart(){ this.tone(90,0.2,'sawtooth',0.25,0.4); this.noise(0.15,0.1,200); },
  rewind(){ for(let i=0;i<8;i++){ setTimeout(()=>this.tone(200+i*80,0.05,'square',0.1),i*40);} },
  boom(){ this.tone(40,0.5,'sine',0.6,0.2); this.noise(0.4,0.3,300); },
  zap(){ this.tone(1200,0.1,'square',0.15,0.1); this.noise(0.08,0.1,6000); },
  whoosh(){ this.noise(0.3,0.15,400); },
  // 唢呐风（滑音）
  suona(freq){ this.tone(freq,0.4,'sawtooth',0.2,1.1); this.tone(freq*1.5,0.4,'square',0.1,1.1); },
  // 播放节奏型
  beatCount:0,
  playBeat(){
    this.beatCount++;
    const b=this.beatCount%4;
    if(b===0){ this.kick(); this.bass(); }
    else if(b===2){ this.snare(); }
    else { this.hat(); }
    // 偶尔加花
    if(Math.random()<0.15){ const notes=[220,277,330,415,494]; this.suona(pick(notes)); }
    if(Math.random()<0.05){ pick([this.bark,this.fart,this.scream,this.spring]).call(this); }
  }
};

// ---------- Three.js 场景 ----------
let scene, camera, renderer, clock;
let stageGroup, monster, ground;
let monsters=[]; // 克隆体
const COLORS = {
  bg:0x0a0612,
  fog:0x1a0a2a
};

let webglAvailable = true;
function showWebGLError(){
  const cv = document.getElementById('game-canvas');
  if(cv){
    cv.style.background = 'linear-gradient(135deg,#1a0a2a,#2a0a1a)';
    cv.innerHTML = '';
  }
  const msg = document.createElement('div');
  msg.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;z-index:90;';
  msg.innerHTML = '<div style="font-size:60px;">🎃</div><div style="font-size:20px;margin:16px 0;font-weight:bold;">需要 WebGL 支持</div><div style="font-size:14px;color:#aaa;max-width:300px;line-height:1.6;">你的浏览器不支持 WebGL 3D 渲染。<br>请使用最新版 Chrome / Edge / Safari / Firefox 打开本游戏。</div>';
  document.getElementById('stage').appendChild(msg);
}
function initThree(){
  // 检测 WebGL 支持
  const testCanvas = document.createElement('canvas');
  const gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
  if(!gl){
    webglAvailable = false;
    showWebGLError();
    return false;
  }

  try{
    scene = new THREE.Scene();
    scene.background = new THREE.Color(COLORS.bg);
    scene.fog = new THREE.Fog(COLORS.fog, 8, 22);

    camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 1.5, 7);
    camera.lookAt(0,1,0);

    renderer = new THREE.WebGLRenderer({ canvas:document.getElementById('game-canvas'), antialias:true, alpha:false, powerPreference:'high-performance', preserveDrawingBuffer:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  }catch(e){
    console.warn('WebGL init failed', e);
    webglAvailable = false;
    showWebGLError();
    return false;
  }

  // 灯光
  const amb = new THREE.AmbientLight(0x6644aa, 0.6); scene.add(amb);
  const key = new THREE.DirectionalLight(0xffccff, 0.9); key.position.set(3,6,4); key.castShadow=true; scene.add(key);
  const rim = new THREE.PointLight(0x00ffcc, 1.2, 15); rim.position.set(-3,2,3); scene.add(rim);
  const back = new THREE.PointLight(0xff00aa, 1.0, 15); back.position.set(0,3,-3); scene.add(back);

  // 舞台
  stageGroup = new THREE.Group(); scene.add(stageGroup);

  // 地面
  const ggeo = new THREE.CylinderGeometry(4,4,0.3,32);
  const gmat = new THREE.MeshStandardMaterial({ color:0x2a1a3a, roughness:0.6, metalness:0.3 });
  ground = new THREE.Mesh(ggeo,gmat); ground.position.y=-1.6; ground.receiveShadow=true; stageGroup.add(ground);

  // 聚光灯柱（氛围）
  for(let i=0;i<6;i++){
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(1.2,6,16,1,true),
      new THREE.MeshBasicMaterial({ color: pick([0xff00aa,0x00ffcc,0xffcc00,0xaa00ff]), transparent:true, opacity:0.08, side:THREE.DoubleSide })
    );
    const a = (i/6)*TAU;
    cone.position.set(Math.cos(a)*3.5,1.5,Math.sin(a)*3.5);
    cone.rotation.z = Math.PI;
    stageGroup.add(cone);
  }

  clock = new THREE.Clock();
  resize();
  return true;
}

function resize(){
  if(!renderer || !camera) return;
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}
window.addEventListener('resize', resize);

// ---------- 怪物工厂 ----------
const MONSTER_TYPES = [
  'pumpkin_king','stitched_bride','mummy','vampire','sea_witch','dark_witch','witch_mouse','frankenstein'
];
const MONSTER_NAMES = {
  pumpkin_king:'南瓜头骷髅王', stitched_bride:'缝线新娘', mummy:'绷带木乃伊',
  vampire:'獠牙伯爵', sea_witch:'海巫乌苏拉', dark_witch:'黑魔女',
  witch_mouse:'黄皮大眼鼠', frankenstein:'绿皮科学怪人'
};

function createMonster(type, rng){
  if(!rng) rng = Math.random;
  const g = new THREE.Group();
  g.userData.type = type;
  g.userData.parts = {};
  const P = g.userData.parts;

  // 描边材质辅助
  function mat(color, opts={}){
    return new THREE.MeshStandardMaterial(Object.assign({
      color, roughness:0.5, metalness:0.1
    }, opts));
  }
  function toon(color){
    return new THREE.MeshToonMaterial({ color });
  }

  // 通用：巨大头部、果冻身体
  const bodyColor = type==='frankenstein'?0x55aa44 : type==='sea_witch'?0xaa44cc : type==='witch_mouse'?0xeebb44 : 0xeeeeee;

  // --- 身体 ---
  let bodyGeo;
  if(type==='sea_witch'){ bodyGeo = new THREE.SphereGeometry(0.9,16,12); }
  else if(type==='frankenstein'){ bodyGeo = new THREE.BoxGeometry(1.1,1.3,0.8); }
  else { bodyGeo = new THREE.SphereGeometry(0.75,16,12); }
  const body = new THREE.Mesh(bodyGeo, toon(bodyColor));
  body.position.y = 0; body.castShadow=true;
  g.add(body); P.body=body;

  // --- 头部（巨大）---
  let headColor = bodyColor;
  if(type==='pumpkin_king') headColor=0xff7700;
  if(type==='mummy') headColor=0xf0e6d0;
  if(type==='dark_witch') headColor=0x22dd44;
  if(type==='vampire') headColor=0xccddee;
  const headGeo = type==='pumpkin_king'? new THREE.SphereGeometry(0.7,16,12) : new THREE.SphereGeometry(0.65,16,12);
  const head = new THREE.Mesh(headGeo, toon(headColor));
  head.position.y = 1.15; head.castShadow=true;
  g.add(head); P.head=head;

  // 眼睛
  function makeEye(x,y,z,r,color){
    const e = new THREE.Mesh(new THREE.SphereGeometry(r,12,10), new THREE.MeshBasicMaterial({color:color||0x000000}));
    e.position.set(x,y,z); return e;
  }
  if(type!=='pumpkin_king'){
    const e1=makeEye(-0.22,1.25,0.55,0.09,0xffffff);
    const e2=makeEye(0.22,1.25,0.55,0.09,0xffffff);
    const p1=makeEye(-0.22,1.25,0.62,0.045);
    const p2=makeEye(0.22,1.25,0.62,0.045);
    g.add(e1,e2,p1,p2); P.eyeL=e1; P.eyeR=e2; P.pupilL=p1; P.pupilR=p2;
  } else {
    // 南瓜发光眼
    const e1=makeEye(-0.2,1.2,0.6,0.1,0xffff00);
    const e2=makeEye(0.2,1.2,0.6,0.1,0xffff00);
    g.add(e1,e2); P.eyeL=e1; P.eyeR=e2;
  }

  // 嘴
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.08,0.05), new THREE.MeshBasicMaterial({color:0x220000}));
  mouth.position.set(0,0.98,0.6); g.add(mouth); P.mouth=mouth;

  // --- 四肢（橡皮管风格）---
  const limbMat = toon(bodyColor);
  // 兼容旧版 Three
  function makeLimb(w,h){
    const geo = new THREE.CylinderGeometry(w,w,h,8);
    const m = new THREE.Mesh(geo, limbMat); m.castShadow=true; return m;
  }

  // 左臂
  const armL = makeLimb(0.13,0.7); armL.position.set(-0.75,0.1,0); P.armL=armL; g.add(armL);
  // 右臂
  const armR = makeLimb(0.13,0.7); armR.position.set(0.75,0.1,0); P.armR=armR; g.add(armR);
  // 左腿
  const legL = makeLimb(0.16,0.7); legL.position.set(-0.3,-0.9,0); P.legL=legL; g.add(legL);
  // 右腿
  const legR = makeLimb(0.16,0.7); legR.position.set(0.3,-0.9,0); P.legR=legR; g.add(legR);

  // --- 特征装饰 ---
  decorateMonster(g, type, mat, toon, makeLimb, rng);

  // 描边（放大反法线）
  addOutline(g, 0.04);

  // 果冻基础缩放
  g.userData.baseScale = 1;
  g.userData.squash = 1;
  g.userData.stretch = 1;
  return g;
}

function decorateMonster(g, type, mat, toon, makeLimb, rng){
  const P = g.userData.parts;

    case 'pumpkin_king':{

        rib.position.set(0,1.15,0); rib.rotation.y=(i/6)*TAU; rib.position.x=Math.cos((i/6)*TAU)*0.55;
        rib.rotation.z=Math.PI/2; g.add(rib);
      }
      // 骷髅身体（肋骨）
      for(let i=0;i<4;i++){

      hair.position.y=1.8; g.add(hair);
      // 婚纱（身体套）
      const dress = new THREE.Mesh(new THREE.ConeGeometry(1.0,1.2,16,1,true), mat(0xffffff,{transparent:true,opacity:0.85,side:THREE.DoubleSide}));
      dress.position.y=-0.4; dress.rotation.x=Math.PI; g.add(dress); P.dress=dress;

      }
      for(let i=0;i<5;i++){

    case 'vampire':{

}

function addOutline(group, thickness){
  const outlineMat = new THREE.MeshBasicMaterial({ color:0x000000, side:THREE.BackSide });
  group.traverse(obj=>{
    if(obj.isMesh && obj.material && obj.material.color){
      // 跳过已经是纯黑或发光的
      try{
        const clone = obj.clone();
        clone.material = outlineMat;
        clone.scale.multiplyScalar(1+thickness);
        clone.position.copy(obj.position);
        obj.parent.add(clone);
      }catch(e){}
    }
  });
}

// ---------- 舞蹈动作系统 ----------
const DANCE_MOVES = [
  'twerk','headbang','floss','robot','breakdance','moonwalk','crab','air_guitar',
  'jump_rope','spiral','ground_roll','limb_tie','head_fly','shimmy','shake','vogue'
];
const MOVE_NAMES = {
  twerk:'电摇', headbang:'甩头', floss:'科目三', robot:'机器人卡点',
  breakdance:'霹雳舞', moonwalk:'太空步', crab:'螃蟹步', air_guitar:'空气吉他',
  jump_rope:'无实物跳绳', spiral:'螺旋升天', ground_roll:'跪地打滚',
  limb_tie:'四肢打结', head_fly:'头飞出去', shimmy:'摇花手', shake:'抽搐', vogue:'社会摇'
};

let currentMove = 'twerk';

let moveDuration = 4;
let frenzyMode = false;

// 动画角色
function animateMonster(m, dt, t, beat){
  const P = m.userData.parts;
  const bpm = AudioEngine.bpm;
  const beatDur = 60/bpm;
  const beatPhase = (t % beatDur)/beatDur;
  const beatPunch = Math.pow(1-beatPhase, 3); // 节拍冲击

  // 基础律动
  const baseBob = Math.sin(t*bpm*TAU/60)*0.08;
  m.position.y = baseBob;

  // 果冻挤压
  const squash = 1 - beatPunch*0.15;
  const stretch = 1 + beatPunch*0.15;
  m.scale.y = stretch * m.userData.stretch;
  m.scale.x = squash * m.userData.squash;
  m.scale.z = squash * m.userData.squash;

  // 随机变异（小概率）
  if(Math.random()<0.003){ triggerMutation(m); }

  switch(currentMove){
    case 'twerk':
      m.rotation.z = Math.sin(t*8)*0.15;
      if(P.legL) P.legL.rotation.x = Math.sin(t*8)*0.3;
      if(P.legR) P.legR.rotation.x = Math.sin(t*8+Math.PI)*0.3;
      break;
    case 'headbang':
      if(P.head) P.head.rotation.x = Math.sin(t*10)*0.8;
      m.position.y = baseBob + Math.abs(Math.sin(t*10))*0.2;
      break;
    case 'floss':
      if(P.armL) P.armL.rotation.z = Math.sin(t*6)*1.2;
      if(P.armR) P.armR.rotation.z = Math.sin(t*6+Math.PI)*1.2;
      if(P.legL) P.legL.rotation.x = Math.sin(t*3)*0.4;
      break;
    case 'robot':
      const rt = Math.floor(t*4)/4;
      m.rotation.y = Math.sin(rt*2)*0.5;
      if(P.armR) P.armR.rotation.x = Math.floor(t*2)%2? -1.2:0;
      if(P.armL) P.armL.rotation.x = Math.floor(t*2+1)%2? -1.2:0;
      break;
    case 'breakdance':
      m.rotation.z = t*4;
      m.position.y = -0.5;
      if(P.legL) P.legL.rotation.x = Math.sin(t*8)*0.8;
      if(P.legR) P.legR.rotation.x = Math.sin(t*8+1)*0.8;
      break;
    case 'moonwalk':
      m.position.x = ((t*0.5)%4)-2;
      if(P.legL) P.legL.rotation.x = Math.sin(t*6)*0.5;
      if(P.legR) P.legR.rotation.x = Math.sin(t*6+Math.PI)*0.5;
      m.rotation.y = -0.3;
      break;
    case 'crab':
      m.position.x = Math.sin(t*2)*1.5;
      if(P.armL) P.armL.rotation.z = Math.sin(t*4)*0.6 + 0.5;
      if(P.armR) P.armR.rotation.z = Math.sin(t*4+Math.PI)*0.6 - 0.5;
      m.rotation.y = Math.PI/2;
      break;
    case 'air_guitar':
      if(P.armL) P.armL.rotation.x = -0.8;
      if(P.armR) P.armR.rotation.x = Math.sin(t*12)*0.5 - 1.0;
      m.rotation.y = -0.4;
      break;
    case 'jump_rope':
      m.position.y = baseBob + Math.abs(Math.sin(t*8))*0.4;
      if(P.armL) P.armL.rotation.z = t*6;
      if(P.armR) P.armR.rotation.z = t*6;
      break;
    case 'spiral':
      m.rotation.y = t*6;
      m.position.y = baseBob + Math.sin(t*2)*0.3;
      if(P.armL) P.armL.rotation.z = 1.2;
      if(P.armR) P.armR.rotation.z = -1.2;
      break;
    case 'ground_roll':
      m.rotation.z = t*3;
      m.position.y = -1.2;
      break;
    case 'limb_tie':
      if(P.armL) P.armL.rotation.z = 2.5 + Math.sin(t)*0.3;
      if(P.armR) P.armR.rotation.z = -2.5 - Math.sin(t)*0.3;
      if(P.legL) P.legL.rotation.z = 1.5;
      if(P.legR) P.legR.rotation.z = -1.5;
      break;
    case 'head_fly':
      if(P.head){
        P.head.position.y = 1.15 + Math.sin(t*4)*0.5;
        P.head.rotation.z = t*2;
      }
      break;
    case 'shimmy':
      m.rotation.z = Math.sin(t*10)*0.1;
      if(P.armL) P.armL.rotation.z = Math.sin(t*10)*1.5 + 0.3;
      if(P.armR) P.armR.rotation.z = Math.sin(t*10+Math.PI)*1.5 - 0.3;
      break;
    case 'shake':
      m.rotation.z = Math.sin(t*20)*0.2;
      if(P.head) P.head.rotation.z = Math.sin(t*25)*0.3;
      m.position.x = Math.sin(t*15)*0.15;
      break;
    case 'vogue':
      if(P.armR) P.armR.rotation.z = -1.2 + Math.sin(t*3)*0.3;
      if(P.armL) P.armL.rotation.z = 1.2 - Math.sin(t*3)*0.3;
      m.rotation.y = Math.sin(t*2)*0.3;
      break;
  }

  // 触手/翅膀等持续动画
  if(P.tentacles){
    P.tentacles.forEach((ten,i)=>{ ten.rotation.x = Math.sin(t*4+i)*0.4; ten.rotation.z = Math.sin(t*3+i*0.7)*0.3; });
  }
  if(P.wingL){ P.wingL.rotation.y = 0.5 + Math.sin(t*10)*0.4; }
  if(P.wingR){ P.wingR.rotation.y = -0.5 - Math.sin(t*10)*0.4; }
  if(P.fire){ P.fire.scale.y = 1 + Math.sin(t*15)*0.4; P.fire.position.y = 1.75 + Math.sin(t*10)*0.05; }
  if(P.cape){ P.cape.rotation.z = Math.sin(t*3)*0.15; }
  if(P.dress){ P.dress.rotation.z = Math.sin(t*3)*0.1; }
}

// 变异效果
function triggerMutation(m){
  const P = m.userData.parts;
  const type = pick(['stretch','invert','head_throw','jaw_drop','ghost']);
  switch(type){
    case 'stretch':
      m.userData.stretch = rand(1.3,2.0);
      setTimeout(()=>{ m.userData.stretch = 1; }, 600);
      break;
    case 'invert':
      m.traverse(o=>{ if(o.isMesh && o.material && o.material.color){ const c=o.material.color; c.setRGB(1-c.r,1-c.g,1-c.b);} });
      setTimeout(()=>{ m.traverse(o=>{ if(o.isMesh && o.material && o.material.color){ const c=o.material.color; c.setRGB(1-c.r,1-c.g,1-c.b);} }); }, 800);
      break;
    case 'head_throw':
      if(P.head){
        const origY = P.head.position.y;
        P.head.position.y = origY + 1.5;
        P.head.rotation.z = TAU;
        setTimeout(()=>{ P.head.position.y = origY; P.head.rotation.z=0; }, 700);
      }
      break;
    case 'jaw_drop':
      if(P.mouth){ P.mouth.scale.y = 5; setTimeout(()=>{ P.mouth.scale.y=1; }, 500); }
      break;
    case 'ghost':
      m.traverse(o=>{ if(o.isMesh && o.material && o.material.opacity!==undefined){ o.material.transparent=true; o.material.opacity=0.4; }});
      setTimeout(()=>{ m.traverse(o=>{ if(o.isMesh && o.material && o.material.opacity!==undefined){ o.material.opacity=1; }}); }, 600);
      break;
  }
  spawnBarrage(pick(['抽象！','离谱！','蚌埠住了','笑死','上头','鬼畜','逆天','绝绝子']));
}

// ---------- 克隆/分身 ----------
function spawnClone(){
  if(monsters.length>8) return;
  const type = pick(MONSTER_TYPES);
  const c = createMonster(type, Math.random);
  const angle = rand(0,TAU);
  const dist = rand(1.5,3);
  c.position.set(Math.cos(angle)*dist, rand(-0.5,0.5), Math.sin(angle)*dist - 1);
  c.scale.setScalar(rand(0.5,0.9));
  stageGroup.add(c);
  monsters.push(c);
  AudioEngine.whoosh();
  setTimeout(()=>{
    if(c.parent){ c.parent.remove(c); monsters=monsters.filter(x=>x!==c); disposeObject(c); }
  }, 6000);
}

function disposeObject(obj){
  obj.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
      else o.material.dispose();
    }
  });
}

// ---------- 暗黑暴走模式 ----------
let abstractValue = 0;
let frenzyActive = false;

function addAbstract(v){
  if(frenzyActive) return;
  abstractValue = clamp(abstractValue+v, 0, 100);
  document.getElementById('meter-fill').style.width = abstractValue+'%';
  if(abstractValue>=100){ triggerFrenzy(); }
}

function triggerFrenzy(){
  if(frenzyActive) return;
  frenzyActive = true;
  document.getElementById('stage').classList.add('fisheye');
  showBigMeme('暗黑暴走！');
  AudioEngine.boom(); AudioEngine.scream();
  spawnBarrage('💀 暗黑暴走 💀');
  for(let i=0;i<30;i++) setTimeout(()=>spawnBarrage(pick(['抽象拉满','今天你摇了吗','不评分不通关只发疯','鬼畜传播','越怪越出片','离谱','蚌埠住了','逆天','笑死','上头'])), i*100);
  // 场景变墓地
  scene.background = new THREE.Color(0x1a0510);
  scene.fog.color.set(0x2a0a1a);
  ground.material.color.set(0x2a1a1a);
  // 生成墓碑
  for(let i=0;i<8;i++){
    const tomb = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.8,0.15), new THREE.MeshStandardMaterial({color:0x666666}));
    const a = (i/8)*TAU;
    tomb.position.set(Math.cos(a)*3.2, -1.1, Math.sin(a)*3.2);
    tomb.rotation.z = rand(-0.2,0.2);
    stageGroup.add(tomb);
    setTimeout(()=>{ if(tomb.parent) tomb.parent.remove(tomb); }, 15000);
  }
  // 镜头鱼眼震动
  cameraShake = 1.5;
  // 多分裂
  for(let i=0;i<5;i++) setTimeout(spawnClone, i*200);
  // 15秒后结束
  setTimeout(()=>{
    frenzyActive = false;
    abstractValue = 0;
    document.getElementById('meter-fill').style.width = '0%';
    document.getElementById('stage').classList.remove('fisheye');
    scene.background = new THREE.Color(COLORS.bg);
    scene.fog.color.set(COLORS.fog);
    ground.material.color.set(0x2a1a3a);
  }, 15000);
}

function spawnBarrage(text){

  el.style.animationDuration = rand(4,8)+'s';
  el.style.color = pick(['#ff00aa','#00ffcc','#ffcc00','#ff3344','#ffffff','#aaff00']);
  el.style.fontSize = rand(18,30)+'px';
  document.getElementById('barrage').appendChild(el);
  setTimeout(()=>el.remove(), 9000);
}
let memeTimer=null;
function showBigMeme(text){
  const el = document.getElementById('bigmeme');
  document.getElementById('bigmeme-text').textContent = text;
  el.style.opacity = 1;
  el.style.transform = 'scale(1.3)';
  setTimeout(()=>{ el.style.transition='all 0.3s'; el.style.opacity=0; el.style.transform='scale(0.8)'; }, 600);
  setTimeout(()=>{ el.style.transition='none'; }, 1000);
}

// ---------- 镜头震动 ----------
let cameraShake = 0;
function applyShake(){
  if(cameraShake>0.01){
    camera.position.x = rand(-cameraShake,cameraShake);
    camera.position.y = 1.5 + rand(-cameraShake,cameraShake)*0.5;
    cameraShake *= 0.9;
  } else {
    camera.position.x = lerp(camera.position.x, 0, 0.1);
    camera.position.y = lerp(camera.position.y, 1.5, 0.1);
  }
}

// ---------- 故障特效 ----------
function flashGlitch(){
  const g = document.getElementById('fx-glitch');
  g.style.opacity = '0.6';
  setTimeout(()=>{ g.style.opacity='0'; }, 80);
}

// ---------- 输入系统 ----------
let touchStartX=0, touchStartY=0, touchStartTime=0, lastTapTime=0, tapCount=0;
let longPressTimer=null;
let activeTouches=0;

function handleTap(){
  randomMove();
  addAbstract(5);
  cameraShake = 0.3;
  AudioEngine.spring();
  flashGlitch();
  spawnBarrage(pick(BARRAGE_MSGS));
}
function handleSwipe(dx,dy){
  if(Math.abs(dx)>Math.abs(dy)){ setMove(Math.random()<0.5?'moonwalk':'crab'); }
  else { setMove('spiral'); }
  addAbstract(6);
  AudioEngine.whoosh();
  cameraShake = 0.2;
  spawnBarrage(pick(['太空步','螃蟹步','螺旋升天','滑行']));
}
function handleLongPress(){
  setMove(pick(['twerk','vogue','shimmy']));
  if(monster && monster.userData){
    monster.userData.stretch = 1.6;
    setTimeout(()=>{ if(monster) monster.userData.stretch=1; }, 500);
  }
  addAbstract(8);
  AudioEngine.rewind();
  spawnBarrage(pick(['拉长了','下腰','章鱼乱舞','弹簧']));
}
function handleDoubleFinger(){
  setMove('limb_tie');
  spawnClone();
  spawnClone();
  addAbstract(12);
  AudioEngine.zap();
  spawnBarrage(pick(['分身','克隆','合体','满屏都是']));
  showBigMeme('分身术！');
}
function handleMultiTap(){
  setMove('shake');
  AudioEngine.bpm = Math.min(180, AudioEngine.bpm+5);
  addAbstract(10);
  cameraShake = 0.5;
  spawnBarrage(pick(['鬼畜暴走','抽搐加速','根本停不下来','冲冲冲']));
}
function handleShake(){
  triggerFrenzy();
}

// 触摸
const canvas = document.getElementById('game-canvas');
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  activeTouches = e.touches.length;
  if(activeTouches>=2){ handleDoubleFinger(); return; }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
  longPressTimer = setTimeout(handleLongPress, 500);
  // 连点检测
  const now = Date.now();
  if(now - lastTapTime < 300){ tapCount++; if(tapCount>=3){ handleMultiTap(); tapCount=0; } }
  else { tapCount=1; }
  lastTapTime = now;
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
  const touches = e.changedTouches[0];
  const dx = touches.clientX - touchStartX;
  const dy = touches.clientY - touchStartY;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const dur = Date.now() - touchStartTime;
  if(activeTouches>=2){ activeTouches=0; return; }
  if(dist>40 && dur<500){ handleSwipe(dx,dy); }
  else if(dur<300){ handleTap(); }
  activeTouches = 0;
}, {passive:false});

// 鼠标（桌面）
let mouseDown=false, mouseSX=0, mouseSY=0, mouseST=0;
canvas.addEventListener('mousedown', e=>{
  mouseDown=true; mouseSX=e.clientX; mouseSY=e.clientY; mouseST=Date.now();
  longPressTimer=setTimeout(handleLongPress,500);
});
canvas.addEventListener('mouseup', e=>{
  mouseDown=false;
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
  const dx=e.clientX-mouseSX, dy=e.clientY-mouseSY;
  const dist=Math.sqrt(dx*dx+dy*dy), dur=Date.now()-mouseST;
  if(dist>40 && dur<500) handleSwipe(dx,dy);
  else if(dur<300) handleTap();
});
canvas.addEventListener('mousemove', e=>{ if(!mouseDown) return; });

// 键盘
window.addEventListener('keydown', e=>{
  switch(e.code){
    case 'Space': e.preventDefault(); handleTap(); break;
    case 'ArrowLeft': handleSwipe(-100,0); break;
    case 'ArrowRight': handleSwipe(100,0); break;
    case 'ArrowDown': handleSwipe(0,100); break;
    case 'ArrowUp': handleLongPress(); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyF': triggerFrenzy(); break;
    case 'KeyC': changeCharacter(); break;
  }
});

// 摇手机（devicemotion）
let lastShake=0, shakeX=0,shakeY=0,shakeZ=0;
window.addEventListener('devicemotion', e=>{
  const a = e.accelerationIncludingGravity;
  if(!a) return;
  const dx=a.x-shakeX, dy=a.y-shakeY, dz=a.z-shakeZ;
  const speed = Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(speed>25 && Date.now()-lastShake>1000){
    handleShake();
    lastShake=Date.now();
  }
  shakeX=a.x; shakeY=a.y; shakeZ=a.z;
});

// ---------- UI 按钮 ----------
let muted = false;
function toggleMute(){
  muted = !muted;
  AudioEngine.setMuted(muted);
  document.getElementById('btn-mute').textContent = muted?'🔊':'🔇';
}
document.getElementById('btn-mute').addEventListener('click', toggleMute);
document.getElementById('btn-frenzy').addEventListener('click', ()=>{ triggerFrenzy(); });
document.getElementById('btn-share').addEventListener('click', openShare);
document.getElementById('btn-change').addEventListener('click', changeCharacter);
document.getElementById('btn-record').addEventListener('click', toggleRecord);
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('close-share').addEventListener('click', ()=>{ document.getElementById('share-modal').style.display='none'; });
document.getElementById('copy-code').addEventListener('click', copyCode);
document.getElementById('gen-gif').addEventListener('click', genGif);

let currentType;
function changeCharacter(){
  if(monster){ stageGroup.remove(monster); disposeObject(monster); }
  let nt; do{ nt=pick(MONSTER_TYPES); }while(nt===currentType && MONSTER_TYPES.length>1);
  currentType = nt;
  monster = createMonster(currentType, Math.random);
  monster.position.set(0,0,0);
  stageGroup.add(monster);
  showBigMeme(MONSTER_NAMES[currentType]);
  AudioEngine.whoosh();
  spawnBarrage('换人：'+MONSTER_NAMES[currentType]);
  addAbstract(3);
}

// ---------- 录制 & 分享 ----------
let recording = false, recordStart = 0;
function toggleRecord(){
  recording = !recording;
  const ind = document.getElementById('rec-indicator');
  if(recording){
    recordStart = Date.now();
    ind.style.display = 'flex';
    showBigMeme('开始录制');
  } else {
    ind.style.display = 'none';
    showBigMeme('录制完成！');
    setTimeout(openShare, 600);
  }
}
function openShare(){
  const code = genChallengeCode();
  document.getElementById('share-code').textContent = code;
  document.getElementById('share-modal').style.display = 'flex';
  window._challengeCode = code;
}
function copyCode(){
  const code = window._challengeCode || document.getElementById('share-code').textContent;
  const ta = document.createElement('textarea');
  ta.value = '《怪物大乱摇》挑战码：'+code+'\n来和我跳同款抽象舞吧！';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showBigMeme('已复制！'); }catch(e){ showBigMeme('复制失败'); }
  document.body.removeChild(ta);
}
function genGif(){
  // 简化版：截图并显示
  showBigMeme('生成表情包...');
  renderer.render(scene,camera);
  try{
    const url = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = 'monster_dance_'+Date.now()+'.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showBigMeme('已保存！');
  }catch(e){ showBigMeme('截图失败'); }
}

// ---------- 自动挂机 ----------
let idleTimer = null;
function startIdleAuto(){
  if(idleTimer) clearInterval(idleTimer);
  idleTimer = setInterval(()=>{
    if(document.hidden) return;
    // 挂机自己发疯
    if(Math.random()<0.7){
      randomMove();
      spawnBarrage(pick(BARRAGE_MSGS));
      addAbstract(4);
    }
    if(Math.random()<0.15){ spawnClone(); }
    if(Math.random()<0.1){ triggerMutation(monster); }
    if(Math.random()<0.05){ flashGlitch(); }
  }, 3000);
}

// ---------- 主循环 ----------
let beatTimer = 0;
function animate(){
  requestAnimationFrame(animate);
  if(!webglAvailable || !renderer) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 节拍
  beatTimer += dt;
  const beatDur = 60/AudioEngine.bpm;
  if(beatTimer >= beatDur){
    beatTimer -= beatDur;
    AudioEngine.playBeat();
  }

  // 动作切换
  moveTime += dt;
  if(moveTime >= moveDuration){
    randomMove();
  }

  // 动画
  if(monster) animateMonster(monster, dt, t, beatTimer);
  monsters.forEach((m,i)=>{
    animateMonster(m, dt, t+i*0.3, beatTimer);
    m.rotation.y += dt*0.5;
  });

  // 地面旋转（氛围）
  if(ground) ground.rotation.y += dt*0.1;

  applyShake();

  renderer.render(scene, camera);
}

// ---------- 启动 ----------
function startGame(){
  document.getElementById('start-screen').style.display = 'none';
  AudioEngine.init();
  AudioEngine.resume();
  const ok = initThree();
  if(!ok){
    // WebGL 不可用：仅显示提示，不启动 3D 游戏逻辑
    return;
  }
  changeCharacter();
  startIdleAuto();
  animate();
  // 开场欢迎
  setTimeout(()=>{ showBigMeme('今天你摇了吗？'); }, 500);
  setTimeout(()=>{ spawnBarrage('不评分不通关只发疯'); }, 1000);
}

// 暴露到全局便于调试
window.MonsterDance = { triggerFrenzy, changeCharacter, setMove, randomMove, spawnClone };

})();
</script>
